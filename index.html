function renderDatePickerPanel(view,anchor){
  const panel=document.getElementById("floatingPanel");
  const t=I18N[state.lang];
  const rtl=document.documentElement.getAttribute("dir")==="rtl";

  const body=view.mode==="days"?renderDaysGrid(view):view.mode==="months"?renderMonthsGrid(view):renderYearsGrid(view);
  const titleHTML=view.mode==="years"
    ?`<input type="text" inputmode="numeric" class="datePanelYearJump" data-year-jump="1" maxlength="4" value="${esc(view.year)}">`
    :`<button type="button" class="datePanelTitleBtn" data-drill="1">${esc(datePanelTitleText(view,t))}</button>`;

  panel.className="floatingPanel datePanel";
  panel.style.width="272px";
  panel.innerHTML=`
    <div class="datePanelHead">
      <button type="button" class="datePanelNav" data-nav="prev" aria-label="Previous">${rtl?ICONS.chevronRight:ICONS.chevronLeft}</button>
      ${titleHTML}
      <button type="button" class="datePanelNav" data-nav="next" aria-label="Next">${rtl?ICONS.chevronLeft:ICONS.chevronRight}</button>
    </div>
    <div class="datePanelBody">${body}</div>
    <div class="datePanelFoot">
      <button type="button" class="ghostBtn" data-today="1">${esc(t.todayLabel)}</button>
      <button type="button" class="ghostBtn" data-clear="1">${esc(t.clearDate)}</button>
    </div>
  `;
  panel.style.display="block";

  panel.querySelector('[data-nav="prev"]').onclick=()=>{
    if(view.mode==="days"){view.month--;if(view.month<0){view.month=11;view.year--;}}
    else if(view.mode==="months"){view.year--;}
    else{view.year-=12;}
    renderDatePickerPanel(view,anchor);
  };
  panel.querySelector('[data-nav="next"]').onclick=()=>{
    if(view.mode==="days"){view.month++;if(view.month>11){view.month=0;view.year++;}}
    else if(view.mode==="months"){view.year++;}
    else{view.year+=12;}
    renderDatePickerPanel(view,anchor);
  };
  const drillBtn=panel.querySelector('[data-drill]');
  if(drillBtn)drillBtn.onclick=()=>{
    view.mode=view.mode==="days"?"months":"years";
    renderDatePickerPanel(view,anchor);
  };
  const yearJump=panel.querySelector('[data-year-jump]');
  if(yearJump){
    const commitJump=()=>{
      if(!yearJump.isConnected)return;
      const val=Math.round(numberValue(yearJump.value));
      if(val&&val!==view.year){view.year=val;renderDatePickerPanel(view,anchor);}
    };
    yearJump.addEventListener("input",()=>{yearJump.value=yearJump.value.replace(/\D/g,"").slice(0,4);});
    yearJump.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();commitJump();}});
    yearJump.addEventListener("blur",()=>{setTimeout(commitJump,0);});
    requestAnimationFrame(()=>{yearJump.focus({preventScroll:true});yearJump.select();});
  }

  if(view.mode==="days"){
    panel.querySelectorAll("[data-day]").forEach(cell=>{
      cell.onclick=()=>{
        const iso=`${view.year}-${String(view.month+1).padStart(2,"0")}-${String(cell.dataset.day).padStart(2,"0")}`;
        view.onPick(iso);closeFloatingPanel();
      };
    });
  }else if(view.mode==="months"){
    panel.querySelectorAll("[data-month]").forEach(cell=>{
      cell.onclick=()=>{view.month=Number(cell.dataset.month);view.mode="days";renderDatePickerPanel(view,anchor);};
    });
  }else{
    panel.querySelectorAll("[data-year]").forEach(cell=>{
      cell.onclick=()=>{view.year=Number(cell.dataset.year);view.mode="months";renderDatePickerPanel(view,anchor);};
    });
  }

  const todayBtn=panel.querySelector("[data-today]");
  if(todayBtn)todayBtn.onclick=()=>{
    const now=new Date();
    view.onPick(dateKey(now));closeFloatingPanel();
  };
  const clearBtn=panel.querySelector("[data-clear]");
  if(clearBtn)clearBtn.onclick=()=>{view.onPick("");closeFloatingPanel();};
  positionFloatingPanel(anchor);
}

function excelSerialToISO(serial){
  const n=Number(serial);
  if(!Number.isFinite(n)||n<=0||n>200000)return"";
  const epoch=Date.UTC(1899,11,30);
  const date=new Date(epoch+Math.round(n)*86400000);
  const iso=`${date.getUTCFullYear()}-${String(date.getUTCMonth()+1).padStart(2,"0")}-${String(date.getUTCDate()).padStart(2,"0")}`;
  return parseDate(iso)?iso:"";
}

function parseFlexibleDate(value){
  if(typeof value==="number")return excelSerialToISO(value);
  const v=(value||"").toString().trim();
  if(!v)return"";
  if(/^\d{5,6}$/.test(v))return excelSerialToISO(v);
  const isoPrefix=v.match(/^(\d{4}-\d{2}-\d{2})/);
  if(isoPrefix)return parseDate(isoPrefix[1])?isoPrefix[1]:"";
  const slash=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if(slash){
    const day=slash[1].padStart(2,"0");
    const month=slash[2].padStart(2,"0");
    const iso=`${slash[3]}-${month}-${day}`;
    return parseDate(iso)?iso:"";
  }
  return"";
}

}

function uniquePersonName(name,excludeId){
  const trimmed=(name||"").trim();
  if(!trimmed)return name;
  const existing=state.people.filter(p=>p.id!==excludeId).map(p=>p.name.trim()).filter(Boolean);
  const taken=n=>existing.some(en=>en.toLowerCase()===n.toLowerCase());
  if(!taken(trimmed))return name;
  let n=2,candidate=`${trimmed} (${n})`;
  while(taken(candidate)){n++;candidate=`${trimmed} (${n})`;}
  return candidate;
}

function resolveDuplicatePersonNames(people){
  const usedLower=new Set();
  people.forEach(p=>{
    const trimmed=(p.name||"").trim();
    if(!trimmed)return;
    let candidate=trimmed;
    if(usedLower.has(candidate.toLowerCase())){
      let n=2;
      candidate=`${trimmed} (${n})`;
      while(usedLower.has(candidate.toLowerCase())){n++;candidate=`${trimmed} (${n})`;}
    }
    p.name=candidate;
    usedLower.add(candidate.toLowerCase());
  });
}

function handlePersonNameBlur(id){

  if(!person)return;
  const unique=uniquePersonName(person.name,id);
  if(unique!==person.name){

function handleRatesFileUpload(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  const t=I18N[state.lang];
  const reader=new FileReader();
  reader.onload=async(e)=>{
    try{
      await ensureXLSX();
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
      const rows=firstNonEmptySheet(wb);
      if(!rows.length)throw new Error("empty");
      let startIdx=0;
      const first=(rows[0]||[]).map(c=>(c??"").toString().trim().toLowerCase());
      if(first.some(v=>v.includes("year")||v.includes("سنة"))||first.some(v=>v.includes("rate")||v.includes("سعر")))startIdx=1;
      let added=0,skipped=0,overwritten=0,unchanged=0;
      for(let i=startIdx;i<rows.length;i++){
        try{
          const row=rows[i];
          if(!row||!row.length)continue;
          const yearRaw=row[0],rateRaw=row[1];
          if(yearRaw===undefined||yearRaw===null||yearRaw===""||rateRaw===undefined||rateRaw===null||rateRaw===""){skipped++;continue;}
          const year=Math.round(clampNumber(yearRaw,MIN_YEAR,MAX_YEAR,0));
          if(!year){skipped++;continue;}
          const parsedRate=Number(rateRaw);
          if(!Number.isFinite(parsedRate)){skipped++;continue;}
          const newRate=clampNumber(parsedRate,-MAX_RATE,MAX_RATE,0);
          const existed=year in state.rates&&state.rates[year]!==""&&state.rates[year]!==null&&state.rates[year]!==undefined;
          if(existed){
            if(Number(state.rates[year])!==newRate)overwritten++;
            else unchanged++;
          }else{
            added++;
          }
          state.rates[year]=newRate;
        }catch{
          skipped++;
        }
      }
      saveState();
      renderSettingsMainBody();
      requestRenderDynamic();
      const parts=[`${t.importedRates} ${added}`];
      if(overwritten)parts.push(`${t.ratesOverwritten} ${overwritten}`);
      if(unchanged)parts.push(`${t.ratesUnchanged} ${unchanged}`);
      if(skipped)parts.push(`${t.skippedRows} ${skipped}`);
      showStatus(parts.join(" · "));
    }catch(err){
      await appAlert(t.importReadError);
    }
  };
  reader.readAsArrayBuffer(file);
  input.value="";
}

function buildHolidaysImportPreview(rows){
  const t=I18N[state.lang];
  const first=(rows[0]||[]).map(c=>(c??"").toString().trim().toLowerCase());
  const isHeader=first.some(v=>v.includes("name")||v.includes("اسم"))||first.some(v=>v.includes("date")||v.includes("تاريخ"));
  const existingKeys=new Set(state.holidays.map(h=>`${h.name.trim().toLowerCase()}|${h.date||""}`));
  const seenInBatch=new Set();
  const entries=[];
  rows.forEach((rawRow,i)=>{
    const row=rawRow||[];
    if(i===0&&isHeader){
      entries.push({rowIndex:i,name:(row[0]??"").toString().trim()||"—",date:"",repeatsAnnually:false,status:"header",reason:t.importDetectedHeader,isDuplicate:false,include:false});
      return;
    }
    const name=(row[0]??"").toString().trim();
    const date=parseFlexibleDate(row[1]);
    const flag=(row[2]??"").toString().trim().toLowerCase();
    const repeatsAnnually=["yes","y","true","1","نعم","تكرار"].includes(flag);
    if(!name&&!date)return;
    let status="import",reason="",isDuplicate=false;
    if(!name||!date){status="skip";reason=t.importMissingFields;}
    else{
      const key=`${name.trim().toLowerCase()}|${date}`;
      isDuplicate=existingKeys.has(key)||seenInBatch.has(key);
      seenInBatch.add(key);
    }
    entries.push({rowIndex:i,name:name||"—",date,repeatsAnnually,status,reason,isDuplicate,include:status==="import"&&!isDuplicate});
  });
  return{type:"holidays",entries};
}

function importPreviewHTML(){
  if(!pendingImport)return"";
  const t=I18N[state.lang];
  const isPeople=pendingImport.type==="people";
  const included=pendingImport.entries.filter(e=>e.include&&e.status==="import").length;
  const skipped=pendingImport.entries.filter(e=>e.status!=="import").length;
  const dupes=pendingImport.entries.filter(e=>e.isDuplicate).length;
  const summary=t.importSummaryLine.replace("{n}",included).replace("{s}",skipped).replace("{d}",dupes);
  const rowsHTML=pendingImport.entries.map(e=>{
    const rowClass=e.status!=="import"?"rowSkipped":e.isDuplicate?"rowDuplicate":"";
    const checkbox=e.status==="import"?`<input type="checkbox" ${e.include?"checked":""} data-change-act="toggleImportRowInclude" data-row-index="${e.rowIndex}">`:"—";

      :e.isAmbiguousHeader?`<span class="importRowBadge dup">${esc(t.importPossibleHeader)}</span>`
      :e.isDuplicate?`<span class="importRowBadge dup">${esc(t.importDuplicateBadge)}</span>`
      :"";
    if(isPeople){
      return`<tr class="${rowClass}"><td>${checkbox}</td><td>${esc(e.name)}</td><td>${esc(e.joinDate||"—")}</td><td>${esc(e.leaveDate||"—")}</td><td>${statusBadge}</td></tr>`;
    }
    return`<tr class="${rowClass}"><td>${checkbox}</td><td>${esc(e.name)}</td><td>${esc(e.date||"—")}</td><td>${e.repeatsAnnually?"✓":"—"}</td><td>${statusBadge}</td></tr>`;
  }).join("");
  const headCols=isPeople
    ?`<th>${t.importColInclude}</th><th>${t.importColName}</th><th>${t.importColJoin}</th><th>${t.importColLeave}</th><th>${t.importColStatus}</th>`
    :`<th>${t.importColInclude}</th><th>${t.importColName}</th><th>${t.importColDate}</th><th>${t.importColRepeats}</th><th>${t.importColStatus}</th>`;
  return`
    <div style="padding:20px 22px 14px;display:flex;flex-direction:column;gap:10px;overflow:hidden;height:100%">
      <h2 class="settingsMainTitle" style="margin:0">${isPeople?esc(t.importPreviewTitlePeople):esc(t.importPreviewTitleHolidays)}</h2>
      <p class="hint">${esc(summary)}</p>
      ${dupes?`<p class="hint">${esc(t.importDuplicateNote)}</p>`:""}
      <div style="overflow:auto;flex:1;border:1px solid var(--line);border-radius:var(--radius-md)">
        <table class="importPreviewTable"><thead><tr>${headCols}</tr></thead><tbody>${rowsHTML}</tbody></table>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;padding-top:4px">
        <button type="button" class="ghostBtn" data-act="closeImportPreview">${t.importCancelBtn}</button>
        <button type="button" class="primaryBtn" data-act="confirmImport" ${included===0?"disabled":""}>${t.importConfirmBtn} (${included})</button>
      </div>
    </div>
  `;
}

function addRatesFromPaste(){

  return t.commercial15;

function freqLabel(frequency,t){

function noticesHTML(data){
  const t=I18N[state.lang];
  const criticalNotices=[];
  if(data.blockedCases.length){
    criticalNotices.push(`<div class="noticeCritical">${ICONS.warning}<span>${esc(t.reportDraftNotice)}</span></div>`);
  }
  const notices=[];
  if(data.invalidCount)notices.push(`${t.invalidCases}: ${data.invalidCases.map(c=>`${c.name} (${c.reason})`).join(", ")}`);
  if(data.unresolvedMissingYears.length)notices.push(`${t.missingRates}: ${data.unresolvedMissingYears.join(", ")}`);
  if(data.resolvedMissingYears.length)notices.push(`${t.missingRatesResolvedNotice}: ${data.resolvedMissingYears.join(", ")}`);
  if(data.unallocated)notices.push(`${t.unallocated}: ${money(data.unallocated)}`);
  if(data.clampedCount)notices.push(t.clampedNotice);
  if(data.cases.length&&!data.people.length)notices.push(t.noPeople);
  if(state.reportTab==="distributionDetails"&&state.distribution==="express")notices.push(t.detailsOnlyExpanded);
  if(new Set(state.weekend).size>=7)notices.push(t.allWeekendDaysNotice);
  return criticalNotices.join("")+notices.map(text=>`<div class="notice">${esc(text)}</div>`).join("")+coverageWarningsHTML(data,{wrapped:false});

function ledgerRows(cases){

    if(!item.segments.length){

function caseExplanationHTML(item,t){
  const compoundingLine=item.compounding?t.compoundingNarrative:t.simpleNarrative;
  const extraSuffix=state.lang==="ar"?".":" is applied each year.";
  const extraLine=state.extraRateEnabled&&numberValue(state.extraRate)!==0?` ${t.extraRateIncluded} ${percent(effectiveExtraRate())}${extraSuffix}`:"";
  const authoritativeLine=item.personAuthoritative?` ${t.personAuthoritativeNote}.`:"";
  const closingSuffix=seg=>item.compounding?` → ${t.closingPrincipalLabel}: ${money(seg.closingPrincipal)}`:"";
  const yearsLines=item.segments.map(seg=>{
    const duration=state.accrual==="actualActual"?`${seg.days} ${t.days}`:`${seg.months} ${t.months}`;
    const resultText=`<strong class="accentText">${item.rounding==="none"?moneyPrecise(seg.returnValue):money(seg.returnValue)}</strong>`;
    if(item.rateFrequency!=="annual"){
      const periods=seg.manual?splitManualSegmentByFrequency(seg,item.rateFrequency):splitSegmentByFrequency(seg,item.rateFrequency);
      return`<div class="explainYearRow">${seg.year} · ${periodText(seg.from,seg.to)} (${duration}) — ${t.yearPrincipal}: <strong>${money(seg.segPrincipal)}</strong> × ${percent(seg.appliedRate)} (${freqLabel(item.rateFrequency,t)}, ${periods.length} ${t.periodsLabel}) = ${resultText}${closingSuffix(seg)}</div>`;
    }
    return`<div class="explainYearRow">${seg.year} · ${periodText(seg.from,seg.to)} (${duration}) — ${t.yearPrincipal}: <strong>${money(seg.segPrincipal)}</strong> × ${percent(seg.appliedRate)} × ${decimal(seg.factor)} = ${resultText}${closingSuffix(seg)}</div>`;
  }).join("");

  return`
    <div class="explanationCase">
      <h3>${esc(item.name)} <span class="mutedText">— ${item.durationMode==="none"?t.noScheduleDuration:periodText(item.start,item.end)}</span></h3>
      <div class="explainGrid">
        <div><span>${t.shortage}</span><strong>${money(item.shortage)}</strong></div>
        <div><span>${t.expenseRate}</span><strong>${percent(item.expenseRate)} → ${money(item.expenseValue)}</strong></div>
        <div><span>${t.checklistTitle}</span><strong>${componentsLabel(item,t)}</strong></div>
        <div><span>${t.base}</span><strong>${money(item.base)}</strong></div>
        <div><span>${t.calculationLogic}</span><strong>${getAccrualLabel(state.accrual,t)}</strong></div>
        <div><span>${t.rateFrequency}</span><strong>${freqLabel(item.rateFrequency,t)}</strong></div>
        <div><span>${t.returnMode}</span><strong>${item.compounding?t.compoundingMode:t.simpleMode}</strong></div>
        <div><span>${t.rounding}</span><strong>${roundingLabel(item.rounding,t)}</strong></div>
      </div>
      <p class="explainNote">${compoundingLine}${extraLine}${authoritativeLine}</p>
      <div class="explainYears">${yearsLines}</div>
      <p class="explainResult">${t.returnTotal}: <strong class="accentText">${item.rounding==="none"?moneyPrecise(item.returnValue):money(item.returnValue)}</strong> &nbsp;·&nbsp; ${t.due}: <strong>${item.rounding==="none"?moneyPrecise(item.due):money(item.due)}</strong></p>
      ${(()=>{
        if(!item.missingYears.length)return"";
        const rawCase=state.cases.find(c=>c.id===item.id);
        const ack=Array.isArray(rawCase&&rawCase.acknowledgedMissingYears)?rawCase.acknowledgedMissingYears:[];
        const unresolved=item.missingYears.filter(y=>!ack.includes(y));
        const resolved=item.missingYears.filter(y=>ack.includes(y));
        const lines=[];
        if(unresolved.length)lines.push(`${t.missingRates}: ${unresolved.join(", ")}`);
        if(resolved.length)lines.push(`${t.missingRatesResolvedNotice}: ${resolved.join(", ")}`);
        return `<p class="notice">${lines.join(" · ")}</p>`;
      })()}
    </div>
  `;
}

function reportPeriodRangeText(data){
  if(!data.cases.length)return"";
  const dated=data.cases.filter(item=>item.durationMode==="dates"&&item.start&&item.end);
  if(!dated.length){
    return data.cases.map(item=>item.manualLabel).filter(Boolean).join(" · ");
  }
  const minStart=dated.reduce((min,c)=>c.start<min?c.start:min,dated[0].start);
  const maxEnd=dated.reduce((max,c)=>c.end>max?c.end:max,dated[0].end);
  return periodText(minStart,maxEnd);
}

function referenceSections(t){
  const currentAccrualLabel=getAccrualLabel(state.accrual,t);
  const accrualRules=[
    {key:"commercial15",label:t.commercial15,hint:t.commercialHint},
    {key:"actualActual",label:t.actualActual,hint:t.actualHint},
    {key:"inclusiveMonths",label:t.inclusiveMonths,hint:t.monthsHint},
    {key:"nextWorkingMonth",label:t.nextWorkingMonth,hint:t.nextWorkingMonthHint}
  ];
  const roundingRules=[
    {key:"perSegment",label:roundingLabel("perSegment",t)},
    {key:"total",label:roundingLabel("total",t)},
    {key:"none",label:roundingLabel("none",t)}
  ];
  const caseRoundingUsed=[...new Set(state.cases.map(c=>c.rounding))];
  const distributionCurrent=state.distribution==="express"?t.equalLogic:t.workdayLogic;
  const investmentCurrent=state.investmentMode==="perPeriod"?t.investmentPerPeriod:t.investmentBlended;
  const ratesLines=Object.keys(state.rates).sort((a,b)=>Number(a)-Number(b)).map(y=>{
    const r=state.rates[y];
    return`${y}: ${r===""||r===null||r===undefined?t.missingRates:percent(r)}`;
  }).join("\n")||"—";
  const shortNames=weekdayShortLabels();

  return[
    {
      id:"accrual",
      title:t.refAccrualTitle,
      body:
        `${t.refCurrentSetting}: ${currentAccrualLabel}\n\n`+
        accrualRules.map(r=>`${r.key===state.accrual?"→ ":"  "}${r.label}\n${r.hint}`).join("\n\n")
    },
    {
      id:"compounding",
      title:t.refCompoundingTitle,
      body:
        `${t.compoundingHint}\n\n`+
        `${t.rateFrequencyHint}\n\n`+
        `${t.refCurrentSetting}: ${freqLabel(state.rateFrequency,t)}`
    },
    {
      id:"rounding",
      title:t.refRoundingTitle,
      body:
        `${t.refRoundingFormula}\n\n`+
        roundingRules.map(r=>`${caseRoundingUsed.includes(r.key)?"→ ":"  "}${r.label}`).join("\n")+
        `\n\n${t.refRoundingPerCase}`
    },
    {
      id:"distribution",
      title:t.refDistributionTitle,
      body:
        `${t.distributionHint}\n\n${t.investmentModeHint}\n\n`+
        `${t.refCurrentSetting}: ${distributionCurrent} — ${investmentCurrent}`+
        (state.investmentMode==="perPeriod"?`\n\n${t.perPeriodDoubleWeightHint}`:"")
    },
    {
      id:"manual",
      title:t.refManualTitle,
      body:
        `${t.manualInputsHint}\n\n${t.manualWorkingDaysHint}\n\n`+
        `${t.refCurrentSetting}: ${state.manualInputsEnabled?t.enabledLabel:t.offLabel}\n`+
        `${t.refManualDisabledNote}`
    },
    {
      id:"rates",
      title:t.refRatesTitle,
      body:
        `${t.refCurrentSetting} — ${t.auditExtraRate}: ${state.extraRateEnabled?percent(numberValue(state.extraRate)):t.offLabel}\n\n`+
        ratesLines
    },
    {
      id:"calendar",
      title:t.refCalendarTitle,
      body:
        `${t.auditWeekend}: ${state.weekend.map(d=>shortNames[d]).join(", ")||"—"}\n`+
        `${t.auditHolidaysCount}: ${state.holidays.length}`
    },
    {
      id:"invariants",
      title:t.refInvariantsTitle,
      body:t.refInvariantsBody
    },
    {
      id:"precision",
      title:t.refPrecisionTitle,
      body:t.refPrecisionBody
    }
  ];
}

function copyReferences(){
  const t=I18N[state.lang];
  const text=referenceSections(t).map(s=>`## ${s.title}\n${s.body}`).join("\n\n");
  navigator.clipboard?.writeText(text).then(()=>showStatus(I18N[state.lang].copied));
}

function exportReferences(){
  const t=I18N[state.lang];
  const text=referenceSections(t).map(s=>`## ${s.title}\n${s.body}`).join("\n\n");
  const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const stamp=new Date().toISOString().slice(0,10);
  a.href=url;
  a.download=`${t.navReferences}-${stamp}.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showStatus(t.exported);
}

function refreshReportView(fromTabSwitch){
  const data=computeAll();
  const summaryEl=document.getElementById("reportSummary");
  const noticesEl=document.getElementById("reportNotices");
  const tabsEl=document.getElementById("reportTabs");
  const tableEl=document.getElementById("reportTable");
  const apply=()=>{
    if(summaryEl)summaryEl.innerHTML=summaryHTML(data);
    if(noticesEl)noticesEl.innerHTML=noticesHTML(data);
    if(tabsEl){
      tabsEl.querySelectorAll("button[data-tab]").forEach(btn=>{
        btn.classList.toggle("active",btn.dataset.tab===state.reportTab);
      });
      positionReportTabIndicator();
    }
    if(tableEl)tableEl.innerHTML=reportTableHTML(data);
  };
  if(fromTabSwitch)smoothUpdate(tableEl,apply);
  else apply();
}

function positionReportTabIndicator(){
  const tabs=document.getElementById("reportTabs");
  const indicator=document.getElementById("reportTabIndicator");
  const active=tabs&&tabs.querySelector("button.active");
  if(!tabs||!indicator||!active)return;
  indicator.style.transform=`translateX(${active.offsetLeft}px)`;
  indicator.style.width=active.offsetWidth+"px";
}
let indicatorFrameRequested=false;
function scheduleIndicatorReposition(){
  if(indicatorFrameRequested)return;
  indicatorFrameRequested=true;
  requestAnimationFrame(()=>{
    indicatorFrameRequested=false;
    positionNavIndicator();
    if(state.view==="report")positionReportTabIndicator();
  });
}
if(typeof ResizeObserver!=="undefined"){
  new ResizeObserver(scheduleIndicatorReposition).observe(document.documentElement);
}else{
  window.addEventListener("resize",scheduleIndicatorReposition);
}

    const resultText=`<strong class="accentText">${result.rounding==="none"?moneyPrecise(seg.returnValue):money(seg.returnValue)}</strong>`;
    if(result.rateFrequency!=="annual"){
      const periods=seg.manual?splitManualSegmentByFrequency(seg,result.rateFrequency):splitSegmentByFrequency(seg,result.rateFrequency);
      return`<div class="explainYearRow">${seg.year} · ${periodText(seg.from,seg.to)} (${duration}) — ${t.yearPrincipal}: <strong>${money(seg.segPrincipal)}</strong> × ${percent(seg.appliedRate)} (${freqLabel(result.rateFrequency,t)}, ${periods.length} ${t.periodsLabel}) = ${resultText}</div>`;
    }
    return`<div class="explainYearRow">${seg.year} · ${periodText(seg.from,seg.to)} (${duration}) — ${t.yearPrincipal}: <strong>${money(seg.segPrincipal)}</strong> × ${percent(seg.appliedRate)} × ${decimal(seg.factor)} = ${resultText}</div>`;
  }).join("")||`<p class="hint">${result.applyReturn===false?t.returnDisabledNotice:t.noAccrualPeriod}</p>`;
  return`
    <p class="explainNote" style="margin-bottom:10px">${compoundingLine}${authoritativeLine}</p>
    <div class="explainYears">${yearsLines}</div>
    <p class="explainResult">${t.returnTotal}: <strong class="accentText">${result.rounding==="none"?moneyPrecise(result.returnValue):money(result.returnValue)}</strong> &nbsp;·&nbsp; ${t.due}: <strong>${result.rounding==="none"?moneyPrecise(result.due):money(result.due)}</strong></p>
  `;
}

function caseCardPreviewHTML(item,t,data){
  const issue=caseIssueText(item,t);
  if(issue)return`<div class="notice" style="margin:0">${esc(issue)}</div>`;
  
  const result=data?(data.cases.find(c=>c.id===item.id)||null):computeCase(item);
  if(!result)return`<div class="hint">${t.noResults}</div>`;
  
  const rateSource=item.useCustomRate?t.customRateLabel:t.rates;
  const accrual=getAccrualLabel(state.accrual,t);
  const rounding=roundingLabel(item.rounding,t);
  
  return`

    ${result.applyReturn?`<div><strong>${t.calculationLogic}:</strong> ${accrual}</div>`:''}
    <div><strong>${t.rounding}:</strong> ${rounding}</div>
    ${result.applyReturn?`<div class="accentText"><strong>${t.returned}:</strong> ${moneyPrecise(result.returnValue)}</div>`:''}

function caseCardMissingRatesHTML(item,data){
  const t=I18N[state.lang];
  const result=data?(data.cases.find(c=>c.id===item.id)||null):computeCase(item);
  if(!result||!result.missingYears.length)return"";
  const years=result.missingYears;
  const acknowledged=Array.isArray(item.acknowledgedMissingYears)?item.acknowledgedMissingYears:[];
  const unresolvedYears=years.filter(year=>!acknowledged.includes(year));
  const acknowledgedYears=years.filter(year=>acknowledged.includes(year));
  const allAcknowledged=unresolvedYears.length===0;
  const extraActive=state.extraRateEnabled&&numberValue(effectiveExtraRate())!==0;
  const lines=[];
  if(unresolvedYears.length)lines.push(`${esc(t.missingRates)}: ${unresolvedYears.join(", ")}`);
  if(acknowledgedYears.length){
    const extraNote=extraActive?` — ${esc(t.extraRateIncluded)} ${percent(effectiveExtraRate())}`:"";
    lines.push(`${esc(t.missingRatesResolvedNotice)}: ${acknowledgedYears.join(", ")}${extraNote}`);
  }
  return`<div class="notice">
    ${lines.join(" · ")}
    <button type="button" class="ghostBtn" style="margin-inline-start:8px" data-act="addMissingRateYears" data-years="${years.join(",")}">${esc(t.addMissingRatesBtn)}</button>
    <button type="button" class="ghostBtn" style="margin-inline-start:8px" data-act="acknowledgeMissingRates" data-id="${item.id}" data-years="${years.join(",")}" ${allAcknowledged?"disabled":""}>${esc(allAcknowledged?t.missingRatesAcknowledged:t.acknowledgeMissingRatesBtn)}</button>
  </div>`;
}

function caseCardCoverageHTML(item,data){
  const t=I18N[state.lang];
  const result=data?(data.cases.find(c=>c.id===item.id)||null):computeCase(item);
  if(!result)return"";
  if(state.distribution==="expanded"&&(result.durationMode==="manual"||result.durationMode==="none")){
    const anyManual=state.people.some(p=>manualDaysValue(p,result.id)!==null);
    if(!anyManual)return`<div class="noticeCritical">${ICONS.warning}<span>${esc(result.durationMode==="none"?t.noScheduleNeedsManualWeight:t.manualDaysRequired)}</span></div>`;
    if(state.investmentMode==="perPeriod"){
      const missingYears=(result.segments||[]).filter(seg=>!state.people.some(p=>manualSegmentDaysValue(p,result.id,seg.year)!==null)).map(seg=>seg.year);
      if(missingYears.length)return`<div class="notice">${esc(t.manualSegmentDaysMissing)} (${missingYears.join(", ")})</div>`;
    }
    return"";
  }
  const gaps=result.coverageGaps||caseCoverageGaps(result,eligiblePeople());
  return renderCoverageGapNotices(gaps,null);
}

function addMissingRateYears(years){
  years.forEach(y=>{ if(!(y in state.rates))state.rates[y]=""; });
  saveState();
  openSettings();
}

function acknowledgeMissingRates(id,years){
  const item=state.cases.find(c=>c.id===id);
  if(!item)return;
  const current=Array.isArray(item.acknowledgedMissingYears)?item.acknowledgedMissingYears:[];
  item.acknowledgedMissingYears=[...new Set([...current,...years])];
  saveState();
  render();
}

    noInvestmentBasis:t.caseIssueNoInvestmentBasis,

function refreshPeopleTable(data){
  const tbody=document.getElementById("peopleTableBody");
  if(!tbody)return;
  data=data||computeAll();
  const t=I18N[state.lang];
  const visible=visiblePeopleList();
  const existingIds=[...tbody.querySelectorAll("tr[data-person-id]")].map(tr=>tr.dataset.personId);
  const targetIds=visible.map(p=>p.id);
  const structuralChange=existingIds.length!==targetIds.length||existingIds.some((id,i)=>id!==targetIds[i]);

  if(structuralChange){
    const isPureAppend=targetIds.length>existingIds.length&&existingIds.every((id,i)=>id===targetIds[i]);
    if(isPureAppend){
      visible.slice(existingIds.length).forEach(person=>{
        tbody.insertAdjacentHTML("beforeend",personRowHTML(person,data,t,state.people.indexOf(person)));
        tbody.lastElementChild?.classList.add("rowEnter");
      });
    }else{
      const active=document.activeElement;
      const activeRow=active&&tbody.contains(active)?active.closest("tr[data-person-id]"):null;
      const focusPersonId=activeRow?activeRow.dataset.personId:null;
      const focusField=focusPersonId&&active.dataset?active.dataset.field:null;
      const focusSelection=focusField&&typeof active.selectionStart==="number"?active.selectionStart:null;
      smoothUpdate(tbody,()=>{tbody.innerHTML=visible.map(p=>personRowHTML(p,data,t,state.people.indexOf(p))).join("");});
      if(focusField){
        const restored=tbody.querySelector(`tr[data-person-id="${focusPersonId}"] [data-field="${focusField}"]`);
        if(restored){
          restored.focus({preventScroll:true});
          if(focusSelection!==null&&typeof restored.setSelectionRange==="function"){
            restored.setSelectionRange(focusSelection,focusSelection);
          }
        }
      }

const PEOPLE_HEADER_HINTS={
  name:["name","الاسم","اسم"],
  join:["join","start","from","بداية","انضمام","استلام"],
  leave:["leave","end","to","نهاية","انسحاب","تسوية"]
};

function detectHeaderColumns(row){
  if(!Array.isArray(row))return null;
  const cols={name:-1,join:-1,leave:-1};
  row.forEach((cell,idx)=>{
    const v=(cell??"").toString().trim().toLowerCase();
    if(!v)return;
    if(cols.name===-1&&PEOPLE_HEADER_HINTS.name.some(h=>v.includes(h)))cols.name=idx;
    else if(cols.join===-1&&PEOPLE_HEADER_HINTS.join.some(h=>v.includes(h)))cols.join=idx;
    else if(cols.leave===-1&&PEOPLE_HEADER_HINTS.leave.some(h=>v.includes(h)))cols.leave=idx;
  });
  return cols.name!==-1?cols:null;
}

function firstNonEmptySheet(wb){
  for(const name of wb.SheetNames){
    const sheet=wb.Sheets[name];
    const rows=XLSX.utils.sheet_to_json(sheet,{header:1,raw:false,dateNF:"yyyy-mm-dd",blankrows:false});
    if(rows.length)return rows;
  }
  return[];
}


function handlePeopleFileUpload(input){
  const file=input.files&&input.files[0];

    try{
      await ensureXLSX();
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array",cellDates:true});
      const rows=firstNonEmptySheet(wb);
      if(!rows.length)throw new Error("empty");
      openImportPreview("people",rows);
    }catch(err){
      await appAlert(t.importReadError);
    }
  };
  reader.readAsArrayBuffer(file);
  input.value="";
}
function buildPeopleImportPreview(rows){
  const t=I18N[state.lang];
  let cols={name:0,join:1,leave:2};
  let headerRowIndex=null;
  const headerCols=detectHeaderColumns(rows[0]);
  if(headerCols){cols=headerCols;headerRowIndex=0;}
  let ambiguousFirstRow=false;
  if(headerRowIndex===null){
    const first=rows[0]||[];
    const startIsDate=!!parseFlexibleDate(first[1]);
    const endIsDate=!!parseFlexibleDate(first[2]);
    if(!startIsDate&&!endIsDate&&(first[0]||"").toString().trim())ambiguousFirstRow=true;
  }
  const fallback=inheritedPerson();
  const existingKeys=new Set(state.people.map(p=>`${p.name.trim().toLowerCase()}|${p.joinDate||""}|${p.leaveDate||""}`));
  const seenInBatch=new Set();
  const entries=[];
  rows.forEach((rawRow,i)=>{
    const row=rawRow||[];
    const name=(row[cols.name]??"").toString().trim();
    if(i===headerRowIndex){
      entries.push({rowIndex:i,name:name||"—",joinDate:"",leaveDate:"",status:"header",reason:t.importDetectedHeader,isAmbiguousHeader:false,isDuplicate:false,include:false});
      return;
    }
    if(!row.some(c=>(c??"").toString().trim()))return;
    const joinDate=(cols.join>-1?parseFlexibleDate(row[cols.join]):"")||fallback.joinDate;
    const leaveDate=(cols.leave>-1?parseFlexibleDate(row[cols.leave]):"")||fallback.leaveDate;
    let status="import",reason="";
    if(!name){status="skip";reason=t.importNoName;}
    let isDuplicate=false;
    if(status==="import"){
      const key=`${name.trim().toLowerCase()}|${joinDate||""}|${leaveDate||""}`;
      isDuplicate=existingKeys.has(key)||seenInBatch.has(key);
      seenInBatch.add(key);
    }
    entries.push({rowIndex:i,name:name||"—",joinDate,leaveDate,status,reason,isAmbiguousHeader:i===0&&ambiguousFirstRow,isDuplicate,include:status==="import"&&!isDuplicate});
  });
  return{type:"people",entries};
}

function setManualDay(personId,caseId,value){
  const person=state.people.find(p=>p.id===personId);
  if(!person)return;
  if(!person.manualDays||typeof person.manualDays!=="object")person.manualDays={};
  const trimmed=String(value??"").trim();
  if(trimmed==="")delete person.manualDays[caseId];
  else person.manualDays[caseId]=trimmed;
  saveState();
  requestRenderDynamic();
}

function setManualSegmentDay(personId,caseId,year,value){
  const person=state.people.find(p=>p.id===personId);
  if(!person)return;
  if(!person.manualSegmentDays||typeof person.manualSegmentDays!=="object")person.manualSegmentDays={};
  if(!person.manualSegmentDays[caseId]||typeof person.manualSegmentDays[caseId]!=="object")person.manualSegmentDays[caseId]={};
  const trimmed=String(value??"").trim();
  if(trimmed===""){
    delete person.manualSegmentDays[caseId][year];
    saveState();
    requestRenderDynamic();
    return;
  }
  let entered=numberValue(trimmed);
  if(entered<0)entered=0;
  const maxDays=manualYearReferenceDays(caseId,year);
  let wasCapped=false;
  let finalValue=entered;
  if(maxDays!==null&&entered>maxDays){
    finalValue=Math.round(maxDays*100)/100;
    wasCapped=true;
  }
  person.manualSegmentDays[caseId][year]=String(finalValue);
  saveState();
  requestRenderDynamic();
  if(wasCapped){
    const t=I18N[state.lang];
    showStatus(`${t.manualDaysCappedNotice} (${decimal(finalValue,1)})`);
  }
}
function manualYearReferenceDays(caseId,year){
  const item=state.cases.find(c=>c.id===caseId);
  if(!item)return null;
  const raw=Array.isArray(item.manualSegments)?item.manualSegments:[];
  const yearNum=Math.round(Number(year));
  const segment=raw.find(s=>Math.round(numberValue(s.year))===yearNum);
  if(!segment)return null;
  const months=numberValue(segment.months);
  if(!Number.isFinite(months)||months<=0)return null;
  const yearFullDays=workingDays(new Date(yearNum,0,1),new Date(yearNum,11,31));
  return yearFullDays*(months/12);
}
function personYearlyAmbiguous(person,item){
  if(!item||item.durationMode!=="manual")return false;
  if(state.investmentMode!=="perPeriod")return false;
  if(manualDaysValue(person,item.id)===null)return false;
  const byYear=person.manualSegmentDays&&person.manualSegmentDays[item.id];
  const hasAnyYearly=byYear&&Object.values(byYear).some(v=>numberValue(v)>0);
  if(hasAnyYearly)return false;
  const acknowledged=person.acknowledgedZeroYearly&&person.acknowledgedZeroYearly[item.id];
  return !acknowledged;
}
function acknowledgeZeroYearly(personId,caseId){
  const person=state.people.find(p=>p.id===personId);
  if(!person)return;
  if(!person.acknowledgedZeroYearly||typeof person.acknowledgedZeroYearly!=="object")person.acknowledgedZeroYearly={};
  person.acknowledgedZeroYearly[caseId]=true;
  saveState();
  renderDynamic();
}

function manualWeightGuidanceNeeded(data){
  if(state.distribution!=="expanded")return false;
  return data.cases.some(item=>["manual","none"].includes(item.durationMode));
}
function anyManualOverridesActive(){
  return state.people.some(person=>{
    if(person.manualDays&&Object.values(person.manualDays).some(v=>v!==""&&v!==null&&v!==undefined))return true;
    if(person.manualSegmentDays&&Object.values(person.manualSegmentDays).some(byYear=>byYear&&Object.values(byYear).some(v=>v!==""&&v!==null&&v!==undefined)))return true;
    return false;
  });
}

function coverageWarningsHTML(data,{wrapped=true}={}){
  const t=I18N[state.lang];
  const parts=[];
  data.cases.forEach(result=>{
    if(state.distribution==="expanded"&&(result.durationMode==="manual"||result.durationMode==="none")){
      const anyManual=state.people.some(p=>{const v=manualDaysValue(p,result.id);return v!==null&&v>0;});
      if(!anyManual){
        parts.push(`<div class="notice">${esc(result.name)}: ${esc(result.durationMode==="none"?t.noScheduleNeedsManualWeight:t.manualDaysRequired)}</div>`);
      }else if(state.investmentMode==="perPeriod"){
        const missingYears=(result.segments||[]).filter(seg=>!state.people.some(p=>{const v=manualSegmentDaysValue(p,result.id,seg.year);return v!==null&&v>0;})).map(seg=>seg.year);
        if(missingYears.length){
          parts.push(`<div class="notice">${esc(result.name)}: ${esc(t.manualSegmentDaysMissing)} (${missingYears.join(", ")})</div>`);
        }
        const mismatches=state.people.filter(p=>{
          const overall=manualDaysValue(p,result.id);
          if(overall===null)return false;
          const yearsSum=(result.segments||[]).reduce((sum,seg)=>{
            const v=manualSegmentDaysValue(p,result.id,seg.year);
            return sum+(v||0);
          },0);
          return Math.abs(overall-yearsSum)>EPS_DAYS;
        });
        if(mismatches.length){
          parts.push(`<div class="notice">${esc(result.name)}: ${esc(t.manualDaysMismatch)} (${mismatches.map(p=>esc(p.name)).join(", ")})</div>`);
        }
        const exceedsReference=[];
        (result.segments||[]).forEach(seg=>{
          const referenceDays=segmentReferenceDays(result,seg);
          if(referenceDays<=0)return;
          state.people.forEach(p=>{
            const v=manualSegmentDaysValue(p,result.id,seg.year);
            if(v!==null&&v>referenceDays+EPS_DAYS)exceedsReference.push(`${p.name} (${seg.year})`);
          });
        });
        if(exceedsReference.length){
          parts.push(`<div class="notice">${esc(result.name)}: ${esc(t.manualDaysExceedsReference)} (${exceedsReference.join(", ")})</div>`);
        }
      }
      return;
    }
    if(result.coverageGaps&&result.coverageGaps.length){
      parts.push(renderCoverageGapNotices(result.coverageGaps,result.name));
    }
  });
  return parts.length?(wrapped?`<div class="card" style="margin-top:16px">${parts.join("")}</div>`:parts.join("")):"";
}

  if(opts.rates){payload.rates=state.rates;}

function exportStateJSON(){
  const t=I18N[state.lang];
  const payload=buildDataExportPayload();
  const keys=Object.keys(payload).filter(k=>!k.startsWith("__"));
  if(!keys.length){showStatus(t.noResults);return;}
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const stamp=new Date().toISOString().slice(0,10);
  a.href=url;
  a.download=`${t.title}-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showStatus(t.exported);
}

function sanitizeImportedCase(item){
  if(!item||typeof item!=="object")return null;
  const oldId=typeof item.id==="string"?item.id:null;
  const next=migrateCase({...blankCase(),...item,id:uid()});
  return{...next,__importedFromId:oldId};
}

function sanitizeImportedPerson(item,caseIdMap){
  if(!item||typeof item!=="object")return null;
  const name=(item.name??"").toString().trim().slice(0,200);
  if(!name)return null;
  const manualDays={};
  if(item.manualDays&&typeof item.manualDays==="object"){
    Object.entries(item.manualDays).forEach(([caseId,value])=>{
      const number=Number(value);
      const mappedId=(caseIdMap&&caseIdMap.get(caseId))||caseId;
      if(Number.isFinite(number)&&number>=0)manualDays[mappedId]=number;
    });
  }
  const manualSegmentDays={};
  if(item.manualSegmentDays&&typeof item.manualSegmentDays==="object"){
    Object.entries(item.manualSegmentDays).forEach(([caseId,byYear])=>{
      if(!byYear||typeof byYear!=="object")return;
      const mappedId=(caseIdMap&&caseIdMap.get(caseId))||caseId;
      const cleanYears={};
      Object.entries(byYear).forEach(([year,value])=>{
        const number=Number(value);
        if(Number.isFinite(number)&&number>=0)cleanYears[year]=number;
      });
      if(Object.keys(cleanYears).length)manualSegmentDays[mappedId]=cleanYears;
    });
  }
  const acknowledgedZeroYearly={};
  if(item.acknowledgedZeroYearly&&typeof item.acknowledgedZeroYearly==="object"){
    Object.entries(item.acknowledgedZeroYearly).forEach(([caseId,value])=>{
      const mappedId=(caseIdMap&&caseIdMap.get(caseId))||caseId;
      if(value===true)acknowledgedZeroYearly[mappedId]=true;
    });
  }
  return{
    id:uid(),
    name,
    joinDate:parseDate(item.joinDate)?item.joinDate:"",
    leaveDate:parseDate(item.leaveDate)?item.leaveDate:"",
    manualDays,
    manualSegmentDays,
    acknowledgedZeroYearly
  };
}

function handleStateFileUpload(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  const t=I18N[state.lang];
  const reader=new FileReader();
  reader.onload=async(e)=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data||typeof data!=="object")throw new Error("bad");
      let caseIdMap=new Map();
      if(Array.isArray(data.cases)&&data.cases.length){
        const cleaned=data.cases.map(sanitizeImportedCase).filter(Boolean);
        if(cleaned.length){
          cleaned.forEach(item=>{
            if(item.__importedFromId)caseIdMap.set(item.__importedFromId,item.id);
            delete item.__importedFromId;
          });
          state.cases=cleaned;
        }
      }
      if(Array.isArray(data.people)&&data.people.length){
        const cleaned=data.people.map(item=>sanitizeImportedPerson(item,caseIdMap)).filter(Boolean);
        if(cleaned.length){
          state.people=cleaned;
          resolveDuplicatePersonNames(state.people);
        }
      }
      if(data.rates&&typeof data.rates==="object"){
        Object.entries(data.rates).forEach(([year,rate])=>{
          const y=Math.round(clampNumber(year,MIN_YEAR,MAX_YEAR,0));
          if(y)state.rates[y]=rate===""?"":clampNumber(rate,-MAX_RATE,MAX_RATE,0);
        });
      }
      if(Array.isArray(data.holidays)){
        state.holidays=data.holidays.filter(h=>h&&typeof h==="object"&&parseDate(h.date)).map(h=>({
          id:uid(),
          name:(h.name??"").toString().trim().slice(0,80),
          date:h.date,
          repeatsAnnually:!!h.repeatsAnnually
        }));
      }
      if(Array.isArray(data.weekend)){
        state.weekend=data.weekend.filter(d=>Number.isInteger(d)&&d>=0&&d<=6);
      }
      if(typeof data.accrual==="string"&&["commercial15","actualActual","inclusiveMonths","nextWorkingMonth"].includes(data.accrual))state.accrual=data.accrual;
      if(typeof data.actualActualPersonBasis==="string"&&["workingDays","calendarDays"].includes(data.actualActualPersonBasis))state.actualActualPersonBasis=data.actualActualPersonBasis;
      if(typeof data.rateFrequency==="string"&&["annual","quarterly","monthly"].includes(data.rateFrequency))state.rateFrequency=data.rateFrequency;
      if(data.extraRate!==undefined)state.extraRate=clampNumber(data.extraRate,-MAX_RATE,MAX_RATE,0);
      if(typeof data.extraRateEnabled==="boolean")state.extraRateEnabled=data.extraRateEnabled;
      if(typeof data.distribution==="string"&&["express","expanded"].includes(data.distribution))state.distribution=data.distribution;
      if(typeof data.investmentMode==="string"&&["blended","perPeriod"].includes(data.investmentMode))state.investmentMode=data.investmentMode;
      if(typeof data.currency==="string")state.currency=data.currency.slice(0,12);
      if(data.numerals==="arab"||data.numerals==="latn")state.numerals=data.numerals;
      if(typeof data.manualInputsEnabled==="boolean")state.manualInputsEnabled=data.manualInputsEnabled;
      if(data.lang==="ar"||data.lang==="en")state.lang=data.lang;
      invalidateCalendarCaches();
      saveState();
      render();
      showStatus(t.dataImported);
    }catch(err){
      await appAlert(t.importReadError);
    }
  };
  reader.readAsText(file);
  input.value="";
}

function exportLedgerRows(data,t){
  const unitLabel=state.accrual==="actualActual"?t.days:t.months;
  const header=[t.case,t.year,t.period,t.shortage,`${t.expenseRate} (%)`,t.expenseValue,t.base,t.yearPrincipal,`${t.annualRate} (%)`,`${t.addition} (%)`,`${t.appliedRate} (%)`,`${t.duration} (${unitLabel})`,t.factor,t.returned,t.due,t.logic];
  const rows=[header];
  data.cases.forEach(item=>{
    const compoundingLogic=item.compounding?t.compoundingMode:t.simpleMode;
    const logic=`${componentsLabel(item,t)} · ${compoundingLogic} · ${getAccrualLabel(state.accrual,t)} · ${freqLabel(item.rateFrequency,t)} · ${roundingLabel(item.rounding,t)}${investmentModelSuffix(item,t)}`;
    if(!item.segments.length){
      const emptyReason=item.applyReturn===false?t.returnDisabledNotice:t.noAccrualPeriod;
      rows.push([item.name,"",periodText(item.start,item.end),item.shortage,item.expenseRate,item.expenseValue,item.base,"","","","","","",0,item.due,`${logic} · ${emptyReason}`]);
      return;
    }
    item.segments.forEach(seg=>{
      const duration=state.accrual==="actualActual"?seg.days:seg.months;
      rows.push([item.name,seg.year,periodText(seg.from,seg.to),item.shortage,item.expenseRate,item.expenseValue,item.base,Number(seg.segPrincipal.toFixed(2)),seg.annualRate,effectiveExtraRate(),seg.appliedRate,duration,Number(seg.factor.toFixed(6)),Number(seg.returnValue.toFixed(2)),item.due,logic]);
    });
  });
  return rows;
}

function exportPeopleTotalsRows(data,t){
  const expanded=state.distribution==="expanded";
  const header=[t.person];
  if(expanded)header.push(t.workdayWeightTotal);
  header.push(t.principalShare,t.returned,t.due,t.logic);
  const rows=[header];
  data.distributionSummary.forEach(row=>{
    const line=[row.personName];
    if(expanded)line.push(row.days);
    line.push(Number(row.principalShare.toFixed(2)),Number(row.returnValue.toFixed(2)),Number(row.amount.toFixed(2)),state.distribution==="express"?t.equalLogic:t.workdayLogic);
    rows.push(line);
  });
  if(!data.distributionSummary.length)return{rows};
  const numericCols=expanded?[1,2,3,4]:[1,2,3];
  const totalRow=new Array(header.length).fill("");
  totalRow[0]=t.grandTotal;
  rows.push(totalRow);
  return{rows,numericCols,totalRowIndex:rows.length-1};
}

function exportDistributionDetailRows(data,t){
  if(state.distribution==="express"){
    const header=[t.case,t.person,t.principalShare,t.returned,t.due,t.logic];
    const rows=[header];
    data.distributionRows.forEach(row=>rows.push([row.caseName,row.personName,Number(row.principalShare.toFixed(2)),Number(row.returnValue.toFixed(2)),Number(row.amount.toFixed(2)),t.equalLogic]));
    if(!data.distributionRows.length)return{rows};
    const totalRow=new Array(header.length).fill("");
    totalRow[0]=t.grandTotal;
    rows.push(totalRow);
    return{rows,numericCols:[2,3,4],totalRowIndex:rows.length-1};
  }
  const header=[t.case,t.person,t.year,t.period,t.workdayWeight,t.principalShare,`${t.annualRate} (%)`,`${t.appliedRate} (%)`,t.factor,t.returned];
  const rows=[header];
  data.distributionDetails.forEach(row=>{
    rows.push([
      row.caseName,row.personName,
      row.noAccrual?"":row.year,
      row.noAccrual?t.noAccrualPeriod:periodText(row.period.from,row.period.to),
      row.days,
      Number(row.principalShare.toFixed(2)),
      row.noAccrual?"":row.annualRate,
      row.noAccrual?"":row.appliedRate,
      row.noAccrual?"":Number(row.factor.toFixed(6)),
      Number(row.returnValue.toFixed(2))
    ]);
  });
  if(!data.distributionDetails.length)return{rows};
  const totalRow=new Array(header.length).fill("");
  totalRow[0]=t.grandTotal;
  rows.push(totalRow);
  return{rows,numericCols:[5,9],totalRowIndex:rows.length-1};
}

function exportExplanationRows(data,t){
  const lines=[];
  data.cases.forEach(item=>{
    lines.push(`${item.name} — ${periodText(item.start,item.end)}`);
    lines.push(`${t.shortage}: ${moneyRaw(item.shortage)}`);
    lines.push(`${t.expenseRate}: ${percent(item.expenseRate)} → ${moneyRaw(item.expenseValue)}`);
    lines.push(`${t.checklistTitle}: ${componentsLabel(item,t)}`);
    lines.push(`${t.base}: ${moneyRaw(item.base)}`);
    lines.push(`${t.calculationLogic}: ${getAccrualLabel(state.accrual,t)}`);
    lines.push(`${t.rateFrequency}: ${freqLabel(item.rateFrequency,t)}`);
    lines.push(`${t.returnMode}: ${item.compounding?t.compoundingMode:t.simpleMode}`);
    lines.push(`${t.rounding}: ${roundingLabel(item.rounding,t)}`);
    item.segments.forEach(seg=>{
      const duration=state.accrual==="actualActual"?`${seg.days} ${t.days}`:`${seg.months} ${t.months}`;
      if(item.rateFrequency!=="annual"){
        const periods=seg.manual?splitManualSegmentByFrequency(seg,item.rateFrequency):splitSegmentByFrequency(seg,item.rateFrequency);
        lines.push(`  ${seg.year} · ${periodText(seg.from,seg.to)} (${duration}) — ${t.yearPrincipal}: ${moneyRaw(seg.segPrincipal)} × ${percent(seg.appliedRate)} (${freqLabel(item.rateFrequency,t)}, ${periods.length} ${t.periodsLabel}) = ${moneyRaw(seg.returnValue)}`);
      }else{
        lines.push(`  ${seg.year} · ${periodText(seg.from,seg.to)} (${duration}) — ${t.yearPrincipal}: ${moneyRaw(seg.segPrincipal)} × ${percent(seg.appliedRate)} × ${decimal(seg.factor)} = ${moneyRaw(seg.returnValue)}`);
      }
    });
    lines.push(`${t.returnTotal}: ${moneyRaw(item.returnValue)} · ${t.due}: ${moneyRaw(item.due)}`);
    if(item.missingYears.length){
      lines.push(`${t.missingRates}: ${item.missingYears.join(", ")}`);
    }
    if(item.coverageGaps&&item.coverageGaps.length){
      lines.push(`${t.coverageGapBadge}: ${item.coverageGaps.map(g=>periodText(g.start,g.end)).join(" · ")}`);
    }
    lines.push("");
  });
  if(data.people.length){
    lines.push(t.explainDistributionTitle);
    if(state.distribution==="express"){
      lines.push(`${t.equalSplitLine} ${data.people.length} ${t.people2}.`);
      lines.push(data.distributionSummary.map(r=>`${r.personName}: ${moneyRaw(r.amount)}`).join(" · "));
    }else{
      data.distributionSummary.forEach(r=>{
        lines.push(`${r.personName}: ${decimal(r.days,0)} ${t.days} → ${t.principalShare} ${moneyRaw(r.principalShare)} → ${t.returned} ${moneyRaw(r.returnValue)} → ${t.due} ${moneyRaw(r.amount)}`);
      });
    }
  }
  return lines.map(l=>[l]);
}

function exportAuditSnapshotRows(data,t){
  const lines=[];
  const now=new Date();
  lines.push(`${t.auditSnapshotTitle}`);
  lines.push(t.auditSnapshotIntro);
  lines.push(`${t.auditSnapshotGenerated}: ${now.toISOString()}`);
  lines.push(`${t.auditSnapshotBuild}: ${CALC_ENGINE_BUILD}`);
  lines.push("");
  lines.push(t.auditSnapshotGlobalTitle);
  lines.push(`${t.calculationLogic}: ${getAccrualLabel(state.accrual,t)}${state.accrual==="actualActual"?` (${t.actualActualPersonBasisLabel}: ${state.actualActualPersonBasis==="calendarDays"?t.actualActualBasisCalendarDays:t.actualActualBasisWorkingDays})`:""}`);
  lines.push(`${t.rateFrequency}: ${freqLabel(state.rateFrequency,t)}`);
  lines.push(`${t.weekendDays}: ${(state.weekend||[]).map(d=>weekdayLabels()[d]).join(", ")||"—"}`);
  lines.push(`${t.holidays}: ${(state.holidays||[]).length?state.holidays.map(h=>`${h.name} (${h.date}${h.repeatsAnnually?`, ${t.repeatsAnnually}`:""})`).join(" · "):"—"}`);
  lines.push(`${t.extraRateSettingLabel}: ${state.extraRateEnabled?`${percent(numberValue(state.extraRate))}`:t.offLabel}`);
  lines.push(`${t.distributionMethod}: ${state.distribution==="express"?t.equalLogic:t.workdayLogic}`);
  lines.push(`${t.investmentModeLabel}: ${state.investmentMode==="blended"?t.investmentBlended:t.investmentPerPeriod}`);
  lines.push(`${t.manualInputs}: ${state.manualInputsEnabled?t.enabledLabel:t.offLabel}`);
  lines.push("");
  lines.push(t.auditSnapshotRatesTitle);
  Object.keys(state.rates).map(Number).sort((a,b)=>a-b).forEach(year=>{
    const rate=state.rates[year];
    lines.push(`  ${year}: ${rate===""||rate===null||rate===undefined?t.auditSnapshotRateMissing:percent(Number(rate))}`);
  });
  lines.push("");
  lines.push(t.auditSnapshotCasesTitle);
  state.cases.forEach(item=>{
    const manual=item.durationMode==="manual";
    const noSchedule=item.durationMode==="none";
    const duration=manual?t.manualDuration:noSchedule?t.noScheduleDuration:`${item.startDate||"—"} → ${item.endDate||"—"}`;
    lines.push(`${item.name||t.calculationName}: ${t.shortage} ${item.shortageValue} · ${t.expenseRate} ${item.expensesRate}% · ${t.durationInput} ${duration} · ${t.rounding} ${roundingLabel(item.rounding,t)} · ${item.compounding?t.compoundingMode:t.simpleMode}${item.useCustomRate?` · ${t.customRateLabel} ${item.customRate}%`:""}${(item.acknowledgedMissingYears||[]).length?` · ${t.missingRatesResolvedNotice}: ${item.acknowledgedMissingYears.join(", ")}`:""}`);
  });
  lines.push("");
  const overridden=state.people.filter(p=>{
    if(p.manualDays&&Object.values(p.manualDays).some(v=>v!==""&&v!==null&&v!==undefined))return true;
    if(p.manualSegmentDays&&Object.values(p.manualSegmentDays).some(byYear=>byYear&&Object.values(byYear).some(v=>v!==""&&v!==null&&v!==undefined)))return true;
    return false;
  });
  if(overridden.length){
    lines.push(t.auditSnapshotManualOverridesTitle);
    overridden.forEach(p=>{
      const overallEntries=Object.entries(p.manualDays||{}).filter(([,v])=>v!==""&&v!==null&&v!==undefined);
      if(overallEntries.length)lines.push(`  ${p.name}: ${overallEntries.map(([caseId,v])=>`${(state.cases.find(c=>c.id===caseId)||{}).name||caseId}=${v}`).join(", ")}`);
    });
  }
  lines.push("");
  lines.push(t.auditSnapshotFileNote);
  return lines.map(l=>[l]);
}

function exportSheetDefinitions(data,t){
  const defs=[
    {key:"ledger",label:t.ledger,result:exportLedgerRows(data,t)},
    {key:"peopleTotals",label:t.peopleTotals,result:exportPeopleTotalsRows(data,t)},
    {key:"distributionDetails",label:t.distributionDetails,result:exportDistributionDetailRows(data,t)},
    {key:"explanation",label:t.explanationTab,result:exportExplanationRows(data,t)}
  ];
  defs.push({key:"excludedCases",label:t.excludedCasesSheet,result:exportExcludedCasesRows(data,t),mandatory:true});
  defs.push({key:"auditSnapshot",label:t.auditSnapshotSheet,result:exportAuditSnapshotRows(data,t),mandatory:true});
  const noticeLines=exportNoticeLines(data,t);
  const summaryOffset=2+noticeLines.length;
  return defs.map(def=>{
    const rows=Array.isArray(def.result)?def.result:def.result.rows;
    const meta=Array.isArray(def.result)?null:def.result;
    const width=Math.max(1,(rows[0]||[]).length);
    const aoa=[[summaryLine(data)],...noticeLines.map(line=>[line]),[],...rows];
    const merges=[{s:{r:0,c:0},e:{r:0,c:width-1}}];
    noticeLines.forEach((_,i)=>merges.push({s:{r:1+i,c:0},e:{r:1+i,c:width-1}}));
    return{
      key:def.key,label:def.label,rows,aoa,
      merges,
      numericCols:meta&&meta.numericCols||null,
      totalAoaRow:meta&&meta.totalRowIndex!=null?meta.totalRowIndex+summaryOffset:null,
      dataStartAoaRow:1+summaryOffset,
      mandatory:!!def.mandatory
    };
  });
}

function buildAuditSnapshot(){

    generatedAt:new Date().toISOString(),

function downloadAuditSnapshotFile(stamp){
  const snapshot=buildAuditSnapshot();
  const blob=new Blob([JSON.stringify(snapshot,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`audit-snapshot-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function applySheetTotalFormulas(ws,def){
  if(!def.numericCols||def.totalAoaRow==null)return;
  const dataEndAoaRow=def.totalAoaRow-1;
  if(dataEndAoaRow<def.dataStartAoaRow)return;
  def.numericCols.forEach(col=>{
    const startRef=XLSX.utils.encode_cell({r:def.dataStartAoaRow,c:col});
    const endRef=XLSX.utils.encode_cell({r:dataEndAoaRow,c:col});
    const totalRef=XLSX.utils.encode_cell({r:def.totalAoaRow,c:col});
    let cachedValue=0;
    for(let r=def.dataStartAoaRow;r<=dataEndAoaRow;r++){
      const cellRef=XLSX.utils.encode_cell({r,c:col});
      const cell=ws[cellRef];
      if(cell&&cell.t==="n"&&typeof cell.v==="number")cachedValue+=cell.v;
    }
    ws[totalRef]={t:"n",v:cachedValue,f:`SUM(${startRef}:${endRef})`};
  });
}

async function performExport(){
  try{
    await ensureXLSX();
  }catch{
    await appAlert(I18N[state.lang].excelEngineLoading);
    return;
  }
  const t=I18N[state.lang];
  const data=computeAll();
  if(data.blockedCases.length){
    showStatus(t.missingRatesBlockTitle);
    return;
  }
  const defs=exportSheetDefinitions(data,t);
  const selected=defs.filter(def=>(def.mandatory||state.exportOptions.sheets[def.key])&&def.rows.length);
  if(!selected.length){
    showStatus(t.noResults);
    return;
  }
  const stamp=new Date().toISOString().slice(0,10);
  try{
    if(state.exportOptions.mode==="separate"){
      selected.forEach(def=>{
        const wb=XLSX.utils.book_new();
        const ws=XLSX.utils.aoa_to_sheet(def.aoa);
        ws["!merges"]=def.merges;
        applySheetTotalFormulas(ws,def);
        XLSX.utils.book_append_sheet(wb,ws,def.label.slice(0,31));
        XLSX.writeFile(wb,`${def.label}-${stamp}.xlsx`);
      });
    }else{
      const wb=XLSX.utils.book_new();
      selected.forEach(def=>{
        const ws=XLSX.utils.aoa_to_sheet(def.aoa);
        ws["!merges"]=def.merges;
        applySheetTotalFormulas(ws,def);
        XLSX.utils.book_append_sheet(wb,ws,def.label.slice(0,31));
      });
      XLSX.writeFile(wb,`${t.title}-${stamp}.xlsx`);
    }
    downloadAuditSnapshotFile(stamp);
  }catch(err){
    await appAlert(t.exportFailed);
    return;
  }
  closeFloatingPanel();
  showStatus(t.exported);
}

        <button class="softBtn langBtn" data-act="toggleLanguage">${t.lang}</button>
        <button class="iconBtn" data-act="toggleTheme" title="${state.theme==='light'?t.dark:t.light}" aria-label="${state.theme==='light'?t.dark:t.light}">${state.theme==='light'?ICONS.moon:ICONS.sun}</button>
        <button class="iconBtn" data-act="openSettings" title="${t.settings}" aria-label="${t.settings}">${ICONS.settings}</button>
      </div>
  `;

  const existingTopbar=app.querySelector(".topbar");
  const existingContainer=app.querySelector("#viewContainer");
  if(!existingTopbar||!existingContainer){
    app.innerHTML=`<div class="topbar">${topbarHTML}</div><div id="viewContainer">${viewBody}</div>`;
    positionNavIndicator();
    if(state.view==="report")positionReportTabIndicator();
    return;
  }
  syncTopbar(existingTopbar,t);
  const applyView=()=>{existingContainer.innerHTML=viewBody;};
  if(!prefersReducedMotion()&&document.startViewTransition){
    document.startViewTransition(applyView);
  }else{
    applyView();
  }
  if(state.view==="report")positionReportTabIndicator();
}

function syncTopbar(topbarEl,t){
  const titleEl=topbarEl.querySelector(".brand h1");
  if(titleEl&&titleEl.textContent!==t.title)titleEl.textContent=t.title;
  topbarEl.querySelectorAll(".navBtn").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.view===state.view);
    const view=btn.dataset.view;
    const label=view==="cases"?t.navCases:view==="people"?t.navPeople:view==="references"?t.navReferences:t.navReport;
    const countSpan=btn.querySelector(".navCount");
    const labelNode=countSpan?countSpan.previousSibling:btn.firstChild;
    if(labelNode&&labelNode.nodeType===Node.TEXT_NODE){
      const wanted=countSpan?label+" ":label;
      if(labelNode.textContent!==wanted)labelNode.textContent=wanted;
    }
  });
  const caseCount=topbarEl.querySelector('[data-view="cases"] .navCount');
  if(caseCount)caseCount.textContent=state.cases.length;
  const peopleCount=topbarEl.querySelector('[data-view="people"] .navCount');
  if(peopleCount)peopleCount.textContent=state.people.length;
  const langBtn=topbarEl.querySelector(".langBtn");
  if(langBtn)langBtn.textContent=t.lang;
  const liteAppBtn=topbarEl.querySelector(".liteAppBtn");
  if(liteAppBtn){liteAppBtn.textContent=t.liteApp;liteAppBtn.title=t.liteApp;}
  const themeBtn=topbarEl.querySelector(".iconBtn[onclick=\"toggleTheme()\"]");
  if(themeBtn){
    themeBtn.innerHTML=state.theme==="light"?ICONS.moon:ICONS.sun;
    themeBtn.title=state.theme==="light"?t.dark:t.light;
    themeBtn.setAttribute("aria-label",state.theme==="light"?t.dark:t.light);
  }
  const settingsBtn=topbarEl.querySelector(".iconBtn[onclick=\"openSettings()\"]");
  if(settingsBtn){settingsBtn.title=t.settings;settingsBtn.setAttribute("aria-label",t.settings);}
  positionNavIndicator();
}

function positionNavIndicator(){
  const nav=document.querySelector(".mainNav");
  const indicator=document.getElementById("navIndicator");
  const active=nav&&nav.querySelector(".navBtn.active");
  if(!nav||!indicator||!active)return;
  indicator.style.transform=`translateX(${active.offsetLeft}px)`;
  indicator.style.width=active.offsetWidth+"px";
}

(function setupDelegation(){
  const root=document.body;
  if(!root)return;
  root.addEventListener("click",e=>{
    const el=e.target.closest("[data-act]");
    if(!el||!root.contains(el))return;
    const handler=ACTIONS[el.dataset.act];
    if(handler)handler(el.dataset,el,e);
  });
  root.addEventListener("input",e=>{
    const el=e.target.closest("[data-act]");
    if(!el||!root.contains(el))return;
    const handler=INPUT_ACTIONS[el.dataset.act];
    if(handler)handler(el.dataset,el,e);
  });
  root.addEventListener("focusout",e=>{
    const el=e.target.closest("[data-blur-act]");
    if(!el||!root.contains(el))return;
    const handler=FOCUSOUT_ACTIONS[el.dataset.blurAct];
    if(handler)handler(el.dataset,el,e);
  });
  root.addEventListener("change",e=>{
    const el=e.target.closest("[data-change-act]");
    if(!el||!root.contains(el))return;
    const handler=CHANGE_ACTIONS[el.dataset.changeAct];
    if(handler)handler(el.dataset,el,e);
  });
})();

function selfTestResultsHTML(results){
  const categories=[...new Set(results.map(r=>r.category))];
  const passCount=results.filter(r=>r.pass).length;
  const failCount=results.length-passCount;
  const sections=categories.map(cat=>{
    const items=results.filter(r=>r.category===cat);
    return`
      <div style="margin-bottom:22px">
        <h3 style="margin:0 0 8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">${esc(cat)}</h3>
        ${items.map(r=>`
          <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:var(--radius-sm);background:var(--surface-solid);margin-bottom:6px;border:1px solid var(--line)">
            <span style="font-weight:700;font-size:14px;color:${r.pass?"var(--success)":"var(--danger)"};min-width:18px">${r.pass?"✓":"✕"}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;color:var(--ink)">${esc(r.name)}</div>
              ${r.detail?`<div style="font-size:11px;color:var(--muted);margin-top:3px;font-family:ui-monospace,monospace;word-break:break-word">${esc(r.detail)}</div>`:""}
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }).join("");
  return`
    <div style="min-height:100vh;background:var(--bg);color:var(--ink);font-family:inherit">
      <div style="max-width:880px;margin:0 auto;padding:36px 20px 60px">
        <h1 style="margin:0 0 6px;font-size:21px;font-weight:700">Self-Test Results</h1>
        <p style="margin:0 0 26px;color:var(--muted);font-size:13px">
          <span style="color:var(--success);font-weight:700">${passCount} passed</span> ·
          <span style="color:${failCount?"var(--danger)":"var(--muted)"};font-weight:700">${failCount} failed</span> ·
          ${results.length} total · build ${esc(CALC_ENGINE_BUILD)}
        </p>
        ${sections}
      </div>
    </div>
  `;
}

if(new URLSearchParams(location.search).get("selftest")==="1"){
  document.body.innerHTML=selfTestResultsHTML(SelfTests.run());
