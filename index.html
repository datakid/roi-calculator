<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f1ea">
<title>حاسبة العائد الاستثماري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#faf9f5;
  --surface:rgba(255,255,255,.74);
  --surface-solid:#ffffff;
  --surface-soft:#f3f1ea;
  --surface-hover:#ece9e0;
  --ink:#141413;
  --muted:#83807a;
  --faint:#b0aea5;
  --line:rgba(20,20,19,.08);
  --line-soft:rgba(20,20,19,.05);
  --accent:#d97757;
  --accent-hover:#c8654a;
  --accent-soft:#f4e3da;
  --accent-2:#6a9bcc;
  --success:#788c5d;
  --warning:#b5813f;
  --danger:#c1584e;
  --shadow-xs:0 1px 2px rgba(20,20,19,.05);
  --shadow-sm:0 3px 10px rgba(20,20,19,.05),0 1px 2px rgba(20,20,19,.05);
  --shadow:0 18px 44px rgba(20,20,19,.08),0 3px 10px rgba(20,20,19,.04),0 0 0 1px rgba(20,20,19,.02);
  --shadow-lg:0 30px 70px rgba(20,20,19,.12),0 8px 22px rgba(20,20,19,.06);
  --shadow-soft:6px 6px 15px rgba(176,174,165,.24),-6px -6px 13px rgba(255,255,255,.92);
  --inset:inset 2px 2px 5px rgba(176,174,165,.30),inset -2px -2px 5px rgba(255,255,255,.85);
  --glow-accent:0 0 0 4px var(--accent-soft);
  --glass-blur:24px;
  --radius-xs:9px;
  --radius-sm:13px;
  --radius-md:18px;
  --radius-lg:26px;
  --radius-xl:30px;
  --radius-pill:999px;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);
}

[data-theme="dark"]{
  --bg:#141413;
  --surface:rgba(28,27,26,.72);
  --surface-solid:#1c1b1a;
  --surface-soft:#211f1d;
  --surface-hover:#292725;
  --ink:#faf9f5;
  --muted:#a8a49b;
  --faint:#6e6b64;
  --line:rgba(250,249,245,.09);
  --line-soft:rgba(250,249,245,.05);
  --accent:#e08b6c;
  --accent-hover:#e89b80;
  --accent-soft:#3a2b23;
  --accent-2:#8bb4dd;
  --success:#93a878;
  --warning:#d1a05f;
  --danger:#e0847a;
  --shadow-xs:0 1px 2px rgba(0,0,0,.3);
  --shadow-sm:0 3px 10px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.2);
  --shadow:0 22px 54px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25),0 0 0 1px rgba(250,249,245,.03);
  --shadow-lg:0 34px 80px rgba(0,0,0,.5),0 10px 26px rgba(0,0,0,.32);
  --shadow-soft:6px 6px 15px rgba(0,0,0,.32),-6px -6px 13px rgba(255,255,255,.025);
  --inset:inset 2px 2px 6px rgba(0,0,0,.42),inset -2px -2px 5px rgba(255,255,255,.025);
  --glow-accent:0 0 0 4px var(--accent-soft);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  padding:18px;
  background:radial-gradient(circle at 12% 0%,rgba(217,119,87,.07),transparent 30rem),radial-gradient(circle at 100% 18%,rgba(106,155,204,.055),transparent 34rem),var(--bg);
  color:var(--ink);
  font-family:"Tajawal","Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:14.5px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background .3s var(--ease-soft),color .3s var(--ease-soft);
}

[dir="rtl"] body{line-height:1.75}
[dir="ltr"] h1,[dir="ltr"] h2,[dir="ltr"] h3,[dir="ltr"] .cardTitle h2{letter-spacing:-.012em}

::selection{background:var(--accent-soft);color:var(--accent-hover)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.money,.metricValue,td.money,th.money,.pill,input[type="number"],input[type="date"]{
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1,"cv05" 1;
}
.money,.metricValue{font-family:"Inter",sans-serif}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:var(--radius-pill);border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:padding-box}

button,input,select,textarea{font:inherit}
button{user-select:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active:not(:disabled){transform:scale(.972)}
h1,h2,h3,p{margin:0}

.app{max-width:1180px;margin:auto}

.topbar{
  position:sticky;top:12px;z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-bottom:20px;padding:10px 12px 10px 16px;
  border:1px solid var(--line);border-radius:var(--radius-xl);
  background:var(--surface);box-shadow:var(--shadow);
  backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
  transition:box-shadow .3s var(--ease-soft),border-color .3s var(--ease-soft);
  contain:layout paint;
  view-transition-name:topbar;
}
@media(max-width:760px){
  .topbar{backdrop-filter:none;-webkit-backdrop-filter:none}
}
[dir="rtl"] .topbar{padding:10px 16px 10px 12px}

.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brandMark{
  width:38px;height:38px;border-radius:13px;flex:none;
  background:linear-gradient(155deg,#eda285 0%,#e2916f 45%,#d97757 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 14px rgba(217,119,87,.32),inset 0 1px 1px rgba(255,255,255,.35);
  position:relative;
}
.brand h1{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}

.mainNav{
  display:flex;gap:3px;padding:4px;border-radius:var(--radius-pill);
  background:var(--surface-soft);box-shadow:var(--inset);flex:none;position:relative;
}
.navIndicator{
  position:absolute;top:4px;bottom:4px;left:0;border-radius:var(--radius-pill);
  background:var(--surface-solid);box-shadow:0 3px 8px rgba(20,20,19,.09),0 0 0 1px var(--line-soft);
  transition:transform .32s var(--ease),width .32s var(--ease);z-index:0;pointer-events:none;
}
.navBtn{
  position:relative;z-index:1;
  border:none;background:transparent;color:var(--muted);
  padding:8px 15px;border-radius:var(--radius-pill);font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
  transition:color .2s var(--ease-soft);
}
.navBtn .navCount{
  font-size:10.5px;font-weight:700;background:var(--surface-hover);color:var(--muted);
  border-radius:var(--radius-pill);padding:1px 7px;
  transition:background .2s var(--ease-soft),color .2s var(--ease-soft);
}
.navBtn.active{color:var(--ink)}
.navBtn.active .navCount{background:var(--accent-soft);color:var(--accent)}
.navBtn:hover:not(.active){color:var(--ink)}

.actions{display:flex;gap:6px;flex:none}
.iconBtn,.softBtn,.primaryBtn,.dangerBtn{
  border:1px solid transparent;border-radius:var(--radius-sm);
  padding:9px 15px;font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:transform .18s var(--ease),background .18s var(--ease-soft),color .18s var(--ease-soft),box-shadow .18s var(--ease-soft),opacity .18s var(--ease-soft),border-color .18s var(--ease-soft);
}
.iconBtn{width:38px;height:38px;padding:0;justify-content:center;background:transparent;color:var(--muted);border-radius:var(--radius-sm)}
.iconBtn:hover{background:var(--surface-soft);color:var(--ink)}
.softBtn{background:var(--surface-soft);color:var(--ink);text-decoration:none;cursor:pointer}
.softBtn:hover{background:var(--surface-hover);transform:translateY(-1px)}
.primaryBtn{background:linear-gradient(155deg,#e59873,#d97757 65%,#cc6a4b);color:#fff;box-shadow:0 8px 18px rgba(217,119,87,.3),inset 0 1px 1px rgba(255,255,255,.22)}
.primaryBtn:hover{transform:translateY(-1.5px);box-shadow:0 12px 24px rgba(217,119,87,.36),inset 0 1px 1px rgba(255,255,255,.25)}
.dangerBtn{background:transparent;color:var(--danger)}
.dangerBtn:hover{background:rgba(193,88,78,.1)}
.ghostBtn{border:none;background:transparent;color:var(--muted);padding:6px 11px;border-radius:var(--radius-xs);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .18s var(--ease-soft),color .18s var(--ease-soft)}
.ghostBtn:hover{color:var(--ink);background:var(--surface-soft)}
.iconBtn svg,.softBtn svg,.primaryBtn svg,.dangerBtn svg,.copyBtn svg,.rmIcon svg{display:block}

button:disabled{opacity:.42;cursor:not-allowed;transform:none!important}

.view{display:flex;flex-direction:column;gap:16px;animation:fadeIn .28s var(--ease)}
@keyframes fadeIn{from{opacity:.5;transform:translateY(2px)}to{opacity:1;transform:none}}

@keyframes rowIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes rowOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-4px)}}
.rowEnter{animation:rowIn .3s var(--ease)}
.rowExit{animation:rowOut .16s var(--ease-soft) forwards;pointer-events:none}

.card{
  background:var(--surface-solid);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow);
  transition:box-shadow .25s var(--ease-soft);
}

.cardHeader{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.cardTitle{display:flex;align-items:center;gap:13px}
.cardTitle h2{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.cardTitle p{font-size:12px;color:var(--muted);margin-top:2px}
.counter{
  width:35px;height:35px;border-radius:var(--radius-xs);flex:none;
  background:var(--surface-soft);box-shadow:var(--inset);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent);font-size:14px;
}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:11.5px;font-weight:600;color:var(--muted)}
.input,select.input{
  border:1px solid var(--line);background:var(--surface-soft);color:var(--ink);
  border-radius:var(--radius-sm);padding:10px 13px;min-height:43px;width:100%;
  box-shadow:var(--inset);transition:border .2s var(--ease-soft),box-shadow .2s var(--ease-soft),background .2s var(--ease-soft);
}
.input:focus,select.input:focus{outline:none;border-color:var(--accent);background:var(--surface-solid);box-shadow:var(--glow-accent)}
.input:focus-visible,select.input:focus-visible{outline:none}
.input::placeholder{color:var(--faint)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:980px){.grid5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.grid3,.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.grid5{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
@media(max-width:420px){.grid5{grid-template-columns:1fr}}

.caseCard{
  border:1px solid var(--line);border-radius:var(--radius-md);padding:17px;
  background:var(--surface-soft);margin-bottom:12px;
  transition:border-color .2s var(--ease-soft),box-shadow .2s var(--ease-soft);
  content-visibility:auto;contain-intrinsic-size:auto 320px;
}
.caseCard:last-child{margin-bottom:0}
.caseCard:hover{border-color:color-mix(in srgb,var(--faint) 55%,transparent)}
.caseTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.caseIdentity{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.caseNumber{
  width:29px;height:29px;border-radius:var(--radius-xs);flex:none;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;
}
.caseName{border:none;background:transparent;font-weight:700;font-size:14.5px;color:var(--ink);width:100%;min-width:80px;padding:4px 2px;border-radius:6px;transition:background .15s var(--ease-soft)}
.caseName:focus{outline:none;background:var(--surface-hover)}
.rowActions{display:flex;gap:4px;flex:none}
.gapBadgeSlot{flex:none}
@media(max-width:620px){
  .caseTop{align-items:flex-start;flex-wrap:wrap}
  .rowActions{margin-inline-start:auto}
  .gapBadge{font-size:10px}
}

details.advanced{margin-top:12px}
details.advanced summary{
  cursor:pointer;font-size:12px;font-weight:600;color:var(--accent);list-style:none;
  display:inline-flex;align-items:center;gap:5px;padding:4px 0;
}
details.advanced summary::-webkit-details-marker{display:none}
details.advanced summary::before{
  content:"";width:6px;height:6px;flex:none;
  border-inline-end:1.6px solid currentColor;border-block-end:1.6px solid currentColor;
  transform:rotate(-45deg);transition:transform .2s var(--ease);
}
details.advanced[open] summary::before{transform:rotate(45deg)}
details.advanced .grid3{margin-top:12px}

.checklistRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.checkChip{
  border:1px solid var(--line);background:var(--surface-soft);color:var(--muted);
  border-radius:var(--radius-pill);padding:9px 15px 9px 12px;font-size:12.5px;font-weight:700;
  display:inline-flex;align-items:center;gap:8px;
  transition:background .2s var(--ease-soft),color .2s var(--ease-soft),border-color .2s var(--ease-soft),transform .16s var(--ease);
}
[dir="rtl"] .checkChip{padding:9px 12px 9px 15px}
.checkChip:disabled{opacity:0.5;cursor:not-allowed;transform:none!important;border-color:var(--line)!important}
.checkChip .chipDot{
  width:16px;height:16px;border-radius:6px;border:1.6px solid var(--faint);flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;
  transition:background .18s var(--ease-soft),border-color .18s var(--ease-soft);
}
.checkChip .chipDot svg{display:none}
.checkChip.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.checkChip.active .chipDot{background:var(--accent);border-color:var(--accent)}
.checkChip.active .chipDot svg{display:block}
.checkChip:hover:not(.active):not(:disabled){border-color:var(--faint);transform:translateY(-1px)}
.checkChip.small{padding:6px 12px 6px 10px;font-size:11.5px}
[dir="rtl"] .checkChip.small{padding:6px 10px 6px 12px}
.checkChip.small .chipDot{width:14px;height:14px}
.checklistSubRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding:11px 13px;border-inline-start:2px solid var(--accent);background:var(--surface-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.checklistSubLabel{font-size:11px;font-weight:700;color:var(--muted);margin-inline-end:2px}
.collapseRows{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s var(--ease-soft)}
.collapseRows>.collapseInner{overflow:hidden;min-height:0}

.rowWarning{border-color:rgba(193,88,78,.35)!important;background:rgba(193,88,78,.05)!important}
.warnBadge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--danger);background:rgba(193,88,78,.1);border-radius:var(--radius-pill);padding:2px 9px;white-space:nowrap}

.segmented{display:grid;gap:4px;padding:4px;border-radius:var(--radius-md);background:var(--surface-soft);box-shadow:var(--inset)}
.segmented button{
  border:none;background:transparent;color:var(--muted);padding:9px 11px;border-radius:var(--radius-xs);
  font-size:12.5px;font-weight:600;transition:background .2s var(--ease-soft),color .2s var(--ease-soft),box-shadow .2s var(--ease-soft);
}
.segmented button.active{background:var(--surface-solid);color:var(--accent);box-shadow:var(--shadow-soft)}

.hint{font-size:11.5px;color:var(--muted);line-height:1.55}

.quickTools{border:1px dashed var(--line);border-radius:var(--radius-md);padding:13px;margin-bottom:14px;transition:border-color .2s var(--ease-soft)}
.quickTools[open]{border-style:solid;border-color:var(--line)}
.quickTools summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink);list-style:none;display:flex;align-items:center;gap:7px}
.quickTools summary::-webkit-details-marker{display:none}
.quickTools summary svg{color:var(--accent);flex:none}
.quickToolsBody{margin-top:13px;display:flex;flex-direction:column;gap:12px}
.inlineRow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.inlineRow .field{flex:1;min-width:130px}

.peopleTableWrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-md)}
table.peopleTable{width:100%;border-collapse:collapse;min-width:520px}
table.peopleTable thead th{
  text-align:start;vertical-align:middle;font-size:11px;font-weight:700;color:var(--muted);
  padding:11px 13px;background:var(--surface-soft);position:sticky;top:0;
}
table.peopleTable tbody td{padding:6px 0;border-top:1px solid var(--line);vertical-align:middle}
table.peopleTable tbody tr{transition:background .15s var(--ease-soft)}
table.peopleTable tbody tr:hover{background:var(--surface-soft)}
table.peopleTable input{border:none;background:transparent;padding:8px;padding-inline-start:13px;border-radius:var(--radius-xs);width:100%;min-height:36px;transition:background .15s var(--ease-soft)}
table.peopleTable input:focus{outline:none;background:var(--surface-solid);box-shadow:var(--glow-accent)}
table.peopleTable td.numCol{width:34px;text-align:center;color:var(--faint);font-size:11.5px;font-weight:700}
table.peopleTable td.rmCol{width:38px;text-align:center;padding-inline:4px}
table.peopleTable td[data-role="daysCell"],table.peopleTable td[data-role="amountCell"]{
  padding-inline:13px;text-align:start;font-variant-numeric:tabular-nums;unicode-bidi:isolate;
}
.rmIcon{border:none;background:transparent;color:var(--faint);width:30px;height:30px;border-radius:var(--radius-xs);display:inline-flex;align-items:center;justify-content:center;transition:background .18s var(--ease-soft),color .18s var(--ease-soft)}
.rmIcon:hover{color:var(--danger);background:rgba(193,88,78,.1)}

.metricsStrip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:760px){.metricsStrip{grid-template-columns:1fr 1fr}}
.metric{
  border:1px solid var(--line);border-radius:var(--radius-md);padding:15px;
  background:var(--surface-soft);transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease-soft);
}
.metric:hover{transform:translateY(-1.5px);border-color:color-mix(in srgb,var(--faint) 45%,transparent)}
.metric.accent{background:linear-gradient(160deg,var(--accent-soft),var(--surface-soft))}
.metricLabel{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px}
.metricValue{font-size:19px;font-weight:800;letter-spacing:-.2px}
.metricValue.accentText{color:var(--accent)}
.metricSub{font-size:10.5px;color:var(--faint);margin-top:4px}

.notice{
  font-size:12px;padding:10px 13px;border-radius:var(--radius-sm);margin-bottom:8px;
  background:rgba(181,129,63,.12);color:var(--warning);border:1px solid rgba(181,129,63,.22);
}

.noticeCritical{
  font-size:13px;font-weight:700;padding:13px 15px;border-radius:var(--radius-sm);margin-bottom:10px;
  background:rgba(193,88,78,.13);color:#c1584e;border:1.5px solid rgba(193,88,78,.4);
  display:flex;align-items:flex-start;gap:9px;line-height:1.5;
}
.noticeCritical svg{flex:none;margin-top:1px}

.gapBadge{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:999px;white-space:nowrap;cursor:help;
}
.gapBadge svg{width:12px;height:12px}
.gapBadgeCritical{background:rgba(193,88,78,.13);color:#c1584e;border:1px solid rgba(193,88,78,.4)}
.gapBadgeInfo{background:rgba(181,129,63,.12);color:var(--warning);border:1px solid rgba(181,129,63,.22)}

.reportDoc{border-top:3px solid var(--accent);padding-top:22px}
.reportToolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:18px}
.reportLetterhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.reportLetterheadTop{display:flex;align-items:center;gap:15px}
.reportLetterheadMark{width:46px;height:46px;border-radius:15px;flex:none;background:linear-gradient(155deg,#eda285,#d97757 70%,#cc6a4b);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(217,119,87,.28),inset 0 1px 1px rgba(255,255,255,.3)}

  position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%) translateY(24px);
  background:var(--ink);color:var(--bg);padding:10px 19px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .28s var(--ease),transform .28s var(--ease);z-index:80;box-shadow:var(--shadow-lg);
}
.actionToast{
  position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%) translateY(24px);
  background:var(--ink);color:var(--bg);padding-block:10px;padding-inline:19px 10px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .28s var(--ease),transform .28s var(--ease);z-index:81;box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:10px;overflow:hidden;
}
.actionToast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.actionToast #actionToastUndo{display:none;padding:5px 12px;background:rgba(255,255,255,.14)}
.actionToast.hasUndo #actionToastUndo{display:inline-flex}
.actionToastBar{position:absolute;bottom:0;inset-inline-start:0;height:2px;background:var(--accent);width:100%;transform-origin:left}
.actionToast.hasUndo .actionToastBar{animation:toastCountdown 30s linear forwards}
@keyframes toastCountdown{from{transform:scaleX(1)}to{transform:scaleX(0)}}
#appDialogBox{
  border:none;border-radius:var(--radius-xl);
  background:var(--surface-solid);color:var(--ink);box-shadow:var(--shadow-lg);
  animation:modalIn .22s var(--ease);position:relative;
  max-width:360px;width:88vw;padding:24px 22px 20px;text-align:center;
}
.appDialogIcon{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--warning);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.appDialogIcon:empty{display:none}
.appDialogMessage{margin:0 0 18px;font-size:14px;line-height:1.6;color:var(--ink)}
.appDialogActions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.appDialogActions button{flex:0 1 auto;min-width:96px;justify-content:center}
[dir="rtl"] .status{transform:translateX(50%) translateY(24px)}
.status.show{opacity:1;transform:translateX(-50%) translateY(0)}
[dir="rtl"] .status.show{transform:translateX(50%) translateY(0)}
[dir="rtl"] .actionToast{transform:translateX(50%) translateY(24px)}
[dir="rtl"] .actionToast.show{transform:translateX(50%) translateY(0)}

@media print{
  body{background:#fff;padding:0}
  .topbar,.reportToolbar,.reportTabs,.filterBar,.status,.actionToast,.floatingPanel,.kpiStrip,#kpiContainer,dialog,.copyBtn,.rmIcon{display:none!important}
  .app{max-width:100%}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .reportDoc{border-top:3px solid #d97757}
}

.manualDurationBox{margin-top:12px;padding:13px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-solid)}
.manualDurationHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.manualDurationRows{display:flex;flex-direction:column;gap:7px}
.manualDurationRow{display:grid;grid-template-columns:1fr 1fr 38px;gap:8px;align-items:center}
.manualPeopleCard{margin-top:0}
.manualDaysTable{min-width:620px}
.manualDaysTable input{min-width:92px}
.manualSource{display:block;font-size:10px;color:var(--faint);margin-top:2px}
.durationModeControl{margin:0 0 12px}
@media(max-width:520px){
  .durationModeControl .segmented{grid-template-columns:1fr!important}
}
.caseCard[data-duration-mode="manual"] .caseDateField,.caseCard[data-duration-mode="none"] .caseDateField{display:none}

.casePreviewStrip{margin-top:14px;padding:12px 14px;background:var(--surface-soft);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 18px}
.casePreviewStrip div{display:flex;gap:6px;align-items:center;white-space:nowrap}
.casePreviewStrip strong{color:var(--ink);font-weight:600}

@media(max-width:760px){
  .topbar{position:relative;top:0;flex-wrap:wrap;border-radius:var(--radius-lg)}

  .mainNav .navBtn{flex:1;justify-content:center;padding-inline:10px}

}

function ensureXLSX(){

    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=()=>resolve(window.XLSX);

  });
}

    refExportBtn:"تصدير كنص",
    refInvariantsBody:"مستحق الحالة = مجموع مستحقات جميع الأشخاص = الرقم الظاهر في الملخص = الرقم في ملف تصدير Excel — هذا يتحقق دائماً، في كل طرق التوزيع. ما يختلف هو أي جهة تُعتبر المصدر الأساسي للرقم: في التوزيع المتساوي والمجمّع (بحسب أيام العمل)، يُحسب عائد الحالة مرة واحدة ويكون هو المصدر الوحيد للحقيقة — أرقام الأشخاص تُشكَّل حسب وزن مشاركتهم الفعلية، ثم تُعاد موازنتها دائماً لتتطابق معه تماماً، دون زيادة أو نقصان — والاستثناء الوحيد هو ألا يكون لأي شخص مؤهَّل وزن أكبر من صفر (مثلاً إذا تُرك كل وزن يدوي عند صفر)؛ عندها لا يمكن توزيع شيء، ويظهر المبلغ كاملاً كمبلغ غير موزَّع بدلاً من تطابق زائف. أما في طريقة \"لكل شخص\"، فيُحسب عائد كل شخص بشكل مستقل حسب فترة مشاركته الفعلية، ويصبح عائد الحالة هو المجموع الحقيقي لهذه الأرقام المستقلة — وتظهر معه ملاحظة \"الإجمالي = مجموع عوائد الأشخاص فعليًا\" أينما ظهر منطق الحساب، حتى لا يُختلط بحساب التوزيع المتساوي/المجمّع.\n\nفجوة التغطية (فترة لا يوجد شخص مسؤول عنها) تُبلَّغ دائماً، حتى لو لم يكن لها أثر مالي — تُوسم بوضوح في الحالتين، ولا تُحذف بصمت أبداً.\n\nالحالة المستبعدة (غير الصالحة) لا تُوقِف التصدير — بل تُدرَج تلقائياً في ورقة مخصصة ضمن ملف Excel باسمها وسبب استبعادها، فلا يمكن أن تختفي بصمت من أي إجمالي أو من التقرير المُسلَّم.",
    refInvariantsTitle:"ما هو مضمون دائماً أن يتطابق",
    refPrecisionTitle:"سياسة الدقة الحسابية",
    refPrecisionBody:"حسابات الاستحقاق تُجرى بأرقام عشرية؛ أي مقارنة \"متقاربة بما يكفي\" تستخدم هامش تفاوت ضئيل جداً (1e-9) لتجاوز ضوضاء التقريب الثنائي، وليس لإخفاء فرق حقيقي.\n\nلا يُقرَّب المبلغ إلى أقرب قرش إلا عند نقطة توزيعه بين الأشخاص أو الفترات — يبقى الحساب الأساسي بدقة كاملة حتى تلك النقطة.\n\nعندما يلزم توزيع رقم إجمالي مقرَّب على أجزاء تجمع بالضبط إلى نفس الرقم، يُستخدم أسلوب \"أكبر باقٍ\": الأجزاء الأقرب للتقريب لأعلى تحصل على القرش الإضافي أولاً، وعند التعادل يُحسم الترتيب بطريقة ثابتة قابلة للتكرار — فنفس المدخلات تُنتج دائماً نفس التوزيع.\n\nهذه الخصائص يتم التحقق منها فعلياً وليست مجرد افتراض — مجموعة اختبارات ذاتية (تُفتح عبر ?selftest=1) تتحقق منها تلقائياً في كل مرة.",

function clampNumber(value,min,max,fallback){
  const n=numberValue(value);
  if(!Number.isFinite(n))return fallback;
  return Math.min(max,Math.max(min,n));
}

function sanitizeManualSegments(list){
  if(!Array.isArray(list))return[];
  return list.map(segment=>({
    id:uid(),
    year:segment&&segment.year!==undefined?segment.year:"",
    months:segment&&segment.months!==undefined?segment.months:""
  }));
}

function migrateCase(item){
  let next=item;
  if(!("includeShortage" in next)){
    const scope=next.scope||"both";
    next={
      ...next,
      includeShortage:scope!=="expenses",
      includeExpenses:scope!=="shortage",
      includeInvestment:next.applyReturn!==false
    };
    if(next.appliesTo==="shortageOnly"){
      next.investmentOnShortage=true;
      next.investmentOnExpenses=false;
    }
  }
  if(!("investmentOnShortage" in next)){
    next={...next,investmentOnShortage:next.includeShortage,investmentOnExpenses:next.includeExpenses};
  }
  next={
    ...next,
    durationMode:["manual","none"].includes(next.durationMode)?next.durationMode:"dates",
    manualSegments:sanitizeManualSegments(next.manualSegments),
    rateFrequency:["annual","quarterly","monthly"].includes(next.rateFrequency)?next.rateFrequency:null,
    acknowledgedMissingYears:Array.isArray(next.acknowledgedMissingYears)
      ?next.acknowledgedMissingYears.map(Number).filter(Number.isFinite)
      :[]
  };
  delete next.scope;
  delete next.appliesTo;
  delete next.applyReturn;
  return next;
}

let pendingDialogResolve=null;
function appDialogKeydown(e){
  if(e.key==="Escape"){
    e.preventDefault();
    window.resolveAppDialog(false);
    return;
  }
  if(e.key==="Enter"){
    const activeTag=document.activeElement&&document.activeElement.tagName;
    if(activeTag==="BUTTON"||activeTag==="TEXTAREA"||activeTag==="SELECT")return;
    if(pendingDialogDefault){e.preventDefault();pendingDialogDefault();}
    return;
  }
  if(e.key!=="Tab")return;
  const box=document.getElementById("appDialogBox");
  const focusable=box?[...box.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]:[];
  if(!focusable.length)return;
  const first=focusable[0],last=focusable[focusable.length-1];
  if(e.shiftKey&&document.activeElement===first){
    last.focus({preventScroll:true});e.preventDefault();
  }else if(!e.shiftKey&&document.activeElement===last){
    first.focus({preventScroll:true});e.preventDefault();
  }
}
function closeAppDialog(){
  document.getElementById("appDialogOverlay")?.classList.remove("open");
  document.removeEventListener("keydown",appDialogKeydown);
  pendingDialogResolve=null;
  pendingDialogDefault=null;
  if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus({preventScroll:true});
}
window.resolveAppDialog=(value)=>{
  if(pendingDialogResolve){const resolve=pendingDialogResolve;closeAppDialog();resolve(value);}
};
function appAlert(message){
  return new Promise(resolve=>{
    if(pendingDialogResolve){const prior=pendingDialogResolve;pendingDialogResolve=null;prior(false);}
    const t=I18N[state.lang];
    lastFocus=document.activeElement;
    document.getElementById("appDialogMessage").textContent=message;
    document.getElementById("appDialogIcon").innerHTML="";
    document.getElementById("appDialogActions").innerHTML=`<button type="button" class="primaryBtn" id="appDialogOk">${esc(t.dialogOk)}</button>`;
    document.getElementById("appDialogOverlay").classList.add("open");
    pendingDialogResolve=resolve;
    document.addEventListener("keydown",appDialogKeydown);
    const okBtn=document.getElementById("appDialogOk");
    okBtn.onclick=()=>window.resolveAppDialog(true);
    pendingDialogDefault=()=>window.resolveAppDialog(true);
    requestAnimationFrame(()=>okBtn.focus({preventScroll:true}));
  });
}
function appConfirm(message,danger){
  return new Promise(resolve=>{
    if(pendingDialogResolve){const prior=pendingDialogResolve;pendingDialogResolve=null;prior(false);}
    const t=I18N[state.lang];
    lastFocus=document.activeElement;
    document.getElementById("appDialogMessage").textContent=message;
    document.getElementById("appDialogIcon").innerHTML=ICONS.warning;
    document.getElementById("appDialogActions").innerHTML=`
      <button type="button" class="ghostBtn" id="appDialogCancel">${esc(t.dialogCancel)}</button>
      <button type="button" class="${danger?"dangerBtn":"primaryBtn"}" id="appDialogConfirm">${esc(t.dialogConfirm)}</button>
    `;
    document.getElementById("appDialogOverlay").classList.add("open");
    pendingDialogResolve=resolve;
    document.addEventListener("keydown",appDialogKeydown);
    const cancelBtn=document.getElementById("appDialogCancel");
    const confirmBtn=document.getElementById("appDialogConfirm");
    cancelBtn.onclick=()=>window.resolveAppDialog(false);
    confirmBtn.onclick=()=>window.resolveAppDialog(true);
    pendingDialogDefault=()=>window.resolveAppDialog(true);
    requestAnimationFrame(()=>(danger?cancelBtn:confirmBtn).focus({preventScroll:true}));
  });
}

function esc(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

const Engine=(function(){
function parseDate(value){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value||""))return null;
  const [y,m,d]=value.split("-").map(Number);
  if(y<MIN_YEAR||y>MAX_YEAR)return null;
  const date=new Date(y,m-1,d);
  if(date.getFullYear()!==y||date.getMonth()!==m-1||date.getDate()!==d)return null;
  return date;
}

function dateKey(date){
  const y=date.getFullYear();
  const m=String(date.getMonth()+1).padStart(2,"0");
  const d=String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function utcDayNumber(date){
  return Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/86400000;
}

function inclusiveDays(start,end){
  return Math.max(0,utcDayNumber(end)-utcDayNumber(start)+1);
}

function daysInYear(year){
  return new Date(year,1,29).getMonth()===1?366:365;
}

function normalizeCommercialStart(d){
  if(d.getDate()>15)return new Date(d.getFullYear(),d.getMonth()+1,1);
  return new Date(d.getFullYear(),d.getMonth(),1);
}

function normalizeCommercialEnd(d){
  if(d.getDate()>=15)return new Date(d.getFullYear(),d.getMonth()+1,0);
  return new Date(d.getFullYear(),d.getMonth(),0);
}

function holidaysForYear(year,cfg){
  if(cfg.holidayByYear.has(year))return cfg.holidayByYear.get(year);
  const occurrences=[];
  for(const h of cfg.holidays){
    const hd=parseDate(h.date);
    if(!hd)continue;
    if(h.repeatsAnnually){
      const occ=new Date(year,hd.getMonth(),hd.getDate());
      if(occ.getMonth()!==hd.getMonth())continue;
      occurrences.push(occ);
    }else if(hd.getFullYear()===year){
      occurrences.push(hd);
    }
  }
  cfg.holidayByYear.set(year,occurrences);
  return occurrences;
}

function isWorkingDay(d,cfg){
  const weekendSet=cfg.weekendSetRef();
  if(weekendSet.has(d.getDay()))return false;
  const dk=dateKey(d);
  return !holidaysForYear(d.getFullYear(),cfg).some(h=>dateKey(h)===dk);
}

function nextWorkingDay(d,cfg){
  let cur=new Date(d);
  let guard=0;
  while(!isWorkingDay(cur,cfg)&&guard<366){cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+1);guard++;}
  return cur;
}

function previousWorkingDay(d,cfg){
  let cur=new Date(d);
  let guard=0;
  while(!isWorkingDay(cur,cfg)&&guard<366){cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()-1);guard++;}
  return cur;
}

function normalizeNextWorkingStart(d,cfg){
  const base=d.getDate()===1?d:new Date(d.getFullYear(),d.getMonth()+1,1);
  return nextWorkingDay(base,cfg);
}

function normalizeNextWorkingEnd(d,cfg){
  const lastOfMonth=new Date(d.getFullYear(),d.getMonth()+1,0);
  const base=d.getDate()===lastOfMonth.getDate()?d:new Date(d.getFullYear(),d.getMonth(),0);
  return previousWorkingDay(base,cfg);
}

function generateSegments(start,end,cfg){
  const segments=[];
  if(cfg.accrual==="commercial15"){
    const effStart=normalizeCommercialStart(start);
    const effEnd=normalizeCommercialEnd(end);
    if(effStart>effEnd)return[];
    for(let y=effStart.getFullYear();y<=effEnd.getFullYear();y++){
      const segStart=(y===effStart.getFullYear())?effStart:new Date(y,0,1);
      const segEnd=(y===effEnd.getFullYear())?effEnd:new Date(y,11,31);
      const months=(segEnd.getFullYear()-segStart.getFullYear())*12+segEnd.getMonth()-segStart.getMonth()+1;
      segments.push({year:y,from:segStart,to:segEnd,months,days:0,factor:months/12});
    }
    return segments;
  }
  if(cfg.accrual==="nextWorkingMonth"){
    const effStart=normalizeNextWorkingStart(start,cfg);
    const effEnd=normalizeNextWorkingEnd(end,cfg);
    if(effStart>effEnd)return[];
    for(let y=effStart.getFullYear();y<=effEnd.getFullYear();y++){
      const segStart=(y===effStart.getFullYear())?effStart:new Date(y,0,1);
      const segEnd=(y===effEnd.getFullYear())?effEnd:new Date(y,11,31);
      const months=(segEnd.getFullYear()-segStart.getFullYear())*12+segEnd.getMonth()-segStart.getMonth()+1;
      segments.push({year:y,from:segStart,to:segEnd,months,days:0,factor:months/12});
    }
    return segments;
  }
  for(let y=start.getFullYear();y<=end.getFullYear();y++){
    const from=start>new Date(y,0,1)?new Date(start):new Date(y,0,1);
    const to=end<new Date(y,11,31)?new Date(end):new Date(y,11,31);
    const days=inclusiveDays(from,to);
    const months=(to.getFullYear()-from.getFullYear())*12+to.getMonth()-from.getMonth()+1;
    const factor=cfg.accrual==="actualActual"?days/daysInYear(y):months/12;
    segments.push({year:y,from,to,months,days,factor});
  }
  return segments;
}

function clampRange(aStart,aEnd,bStart,bEnd){
  const start=aStart>bStart?aStart:bStart;
  const end=aEnd<bEnd?aEnd:bEnd;
  return start<=end?{start,end}:null;
}

function roundUnit(value){
  const v=Number(value)||0;
  const s=v<0?-1:1;
  return s*Math.round(Math.abs(v)+EPS_CALC);
}

function numberValue(value){
  const n=Number(value);
  return Number.isFinite(n)?n:0;
}

function effectiveExtraRate(cfg){
  return cfg.extraRateEnabled?clampNumber(cfg.extraRate,-MAX_RATE,MAX_RATE,0):0;
}

function grossWeekdayCount(start,totalDays,weekendSet){
  if(totalDays<=0)return 0;
  const startDow=start.getDay();
  const fullWeeks=Math.floor(totalDays/7);
  const remainder=totalDays%7;
  let total=fullWeeks*(7-weekendSet.size);
  for(let i=0;i<remainder;i++){
    if(!weekendSet.has((startDow+i)%7))total++;
  }
  return total;
}

function holidayOccurrencesInRange(start,end,cfg){
  const byDate=new Map();
  const startYear=start.getFullYear(),endYear=end.getFullYear();
  for(let y=startYear;y<=endYear;y++){
    for(const occ of holidaysForYear(y,cfg)){
      byDate.set(dateKey(occ),occ);
    }
  }
  return[...byDate.values()];
}

function workingDays(start,end,cfg){
  if(!start||!end||start>end)return 0;
  const cacheKey = `${dateKey(start)}|${dateKey(end)}`;
  if(cfg.workingDaysCache.has(cacheKey)) return cfg.workingDaysCache.get(cacheKey);

  const weekendSet=cfg.weekendSetRef();
  const totalDays=inclusiveDays(start,end);
  let total=grossWeekdayCount(start,totalDays,weekendSet);
  const s=utcDayNumber(start),e=utcDayNumber(end);

  for(const hd of holidayOccurrencesInRange(start,end,cfg)){
    const hn=utcDayNumber(hd);
    if(hn<s||hn>e)continue;
    if(weekendSet.has(hd.getDay()))continue;
    total--;
  }
  const result = Math.max(0,total);
  lruSet(cfg.workingDaysCache,cacheKey,result);
  return result;
}

function allocateUnits(total,weights,mode){
  const step=mode==="whole"?1:mode==="cents"?0.01:null;
  const cleanWeights=weights.map(w=>Math.max(0,numberValue(w)));
  const weightTotal=cleanWeights.reduce((a,b)=>a+b,0);
  if(weightTotal<=0)return cleanWeights.map(()=>0);
  if(step===null){
    return cleanWeights.map(w=>total*w/weightTotal);
  }
  const totalSteps=mode==="cents"?Math.round(total*100):Math.round(total/step);
  const exact=cleanWeights.map(w=>totalSteps*w/weightTotal);
  const floors=exact.map(Math.floor);
  let remaining=totalSteps-floors.reduce((a,b)=>a+b,0);
  exact
    .map((value,index)=>({index,remainder:value-Math.floor(value)}))
    .sort((a,b)=>b.remainder-a.remainder||a.index-b.index)
    .forEach(item=>{
      if(remaining>0){floors[item.index]++;remaining--;}
      else if(remaining<0){floors[item.index]--;remaining++;}
    });
  return floors.map(v=>Math.round(v*step*100)/100);
}

function roundCents(value){
  return Math.round((Number(value)||0)*100)/100;
}

function sanitizeManualSegmentsForCalc(item){
  const raw=Array.isArray(item.manualSegments)?item.manualSegments:[];
  const meaningful=raw.filter(segment=>String(segment.year??"").trim()!==""||String(segment.months??"").trim()!=="");
  if(!meaningful.length)return{ok:false,definitions:[],empty:true};
  const seenYears=new Set();
  const definitions=[];
  for(const segment of meaningful){
    const yearText=String(segment.year??"").trim();
    const monthsText=String(segment.months??"").trim();
    if(yearText===""||monthsText==="")return{ok:false,definitions:[]};
    const year=Math.round(numberValue(segment.year));
    const months=numberValue(segment.months);
    if(!Number.isFinite(year)||year<MIN_YEAR||year>MAX_YEAR)return{ok:false,definitions:[]};
    if(!Number.isFinite(months)||months<=0||months>12)return{ok:false,definitions:[]};
    if(seenYears.has(year))return{ok:false,definitions:[]};
    seenYears.add(year);
    definitions.push({year,months,days:0,factor:months/12,from:{manual:true,year,months},to:null,manual:true});
  }
  definitions.sort((a,b)=>a.year-b.year);
  return{ok:true,definitions};
}

function resolveRateFrequency(item,cfg){
  const v=item&&item.rateFrequency;
  return["annual","quarterly","monthly"].includes(v)?v:cfg.rateFrequency;
}

function splitSegmentByFrequency(segment,frequency,cfg){
  if(frequency==="annual")return[{factor:segment.factor,from:segment.from,to:segment.to}];
  const chunkMonths=frequency==="quarterly"?3:1;
  const periods=[];
  let cursor=new Date(segment.from);
  const end=segment.to;
  while(cursor<=end){
    let periodEnd=new Date(cursor.getFullYear(),cursor.getMonth()+chunkMonths,0);
    if(periodEnd>end)periodEnd=new Date(end);
    const days=inclusiveDays(cursor,periodEnd);
    const months=(periodEnd.getFullYear()-cursor.getFullYear())*12+periodEnd.getMonth()-cursor.getMonth()+1;
    const factor=cfg.accrual==="actualActual"?days/daysInYear(cursor.getFullYear()):months/12;
    periods.push({factor,from:new Date(cursor),to:periodEnd});
    cursor=new Date(periodEnd.getFullYear(),periodEnd.getMonth()+1,1);
  }
  return periods.length?periods:[{factor:segment.factor,from:segment.from,to:segment.to}];
}

function splitManualSegmentByFrequency(segment,frequency){
  if(frequency==="annual")return[{factor:segment.factor}];
  const chunk=frequency==="quarterly"?3:1;
  const periods=[];
  let remaining=segment.months;
  while(remaining>EPS_CALC){
    const take=Math.min(chunk,remaining);
    periods.push({factor:take/12});
    remaining-=take;
  }
  return periods.length?periods:[{factor:segment.factor}];
}

function calculateCaseSegments(definitions,principal,item,cfg){
  const missingYears=[];
  const segments=[];
  const useCustom=!!item.useCustomRate;
  const customRate=useCustom?numberValue(item.customRate):null;
  const frequency=resolveRateFrequency(item,cfg);
  let runningPrincipal=principal;
  definitions.forEach(definition=>{
    const configuredRate=cfg.rates[definition.year];
    const missing=!useCustom&&(configuredRate===""||configuredRate===null||configuredRate===undefined);
    if(missing)missingYears.push(definition.year);
    const annualRate=useCustom?customRate:missing?0:numberValue(configuredRate);
    const appliedRate=annualRate+effectiveExtraRate(cfg);
    const segPrincipal=runningPrincipal;
    const periods=definition.manual?splitManualSegmentByFrequency(definition,frequency):splitSegmentByFrequency(definition,frequency,cfg);
    let rawReturn=0;
    periods.forEach(period=>{
      const periodRaw=runningPrincipal*appliedRate/100*period.factor;
      rawReturn+=periodRaw;
      if(item.compounding)runningPrincipal+=periodRaw;
    });
    const returnValue=item.rounding==="perSegment"?roundUnit(rawReturn):rawReturn;
    if(item.compounding&&item.rounding==="perSegment")runningPrincipal+=returnValue-rawReturn;
    const closingPrincipal=segPrincipal+returnValue;
    segments.push({...definition,annualRate,appliedRate,segPrincipal,rawReturn,returnValue,closingPrincipal,rateFrequency:frequency});
  });
  let total=segments.reduce((sum,segment)=>sum+segment.returnValue,0);
  if(item.rounding==="total")total=roundUnit(segments.reduce((sum,segment)=>sum+segment.rawReturn,0));
  if(item.rounding==="none")total=segments.reduce((sum,segment)=>sum+segment.rawReturn,0);
  if(item.rounding==="total"&&segments.length){
    const adjusted=allocateUnits(total,segments.map(s=>s.rawReturn),"whole");
    segments.forEach((s,i)=>{s.returnValue=adjusted[i];});
  }
  return{segments,total,missingYears,rateFrequency:frequency};
}

function eligiblePeople(cfg){
  return cfg.people.filter(person=>person.name.trim());
}

function personRange(person,start,end){
  if(!start||!end)return null;
  const join=parseDate(person.joinDate)||start;
  const leave=parseDate(person.leaveDate)||end;
  if(join>leave)return null;
  return clampRange(join,leave,start,end);
}

function personHasSegmentDaysForCase(person,caseId){
  const byCase=person.manualSegmentDays&&person.manualSegmentDays[caseId];
  if(!byCase)return false;
  return Object.values(byCase).some(v=>v!==""&&v!==null&&v!==undefined);
}

function manualDaysValue(person,caseId,cfg){
  const caseItem=cfg.cases.find(c=>c.id===caseId);
  if(caseItem&&caseItem.durationMode==="manual"&&personHasSegmentDaysForCase(person,caseId)){
    const byCase=person.manualSegmentDays[caseId];
    const sum=Object.values(byCase).reduce((total,v)=>{
      if(v===""||v===null||v===undefined)return total;
      const n=Number(v);
      return Number.isFinite(n)?total+n:total;
    },0);
    return sum;
  }
  const value=person.manualDays?person.manualDays[caseId]:undefined;
  if(value===""||value===null||value===undefined)return null;
  const number=Number(value);
  return Number.isFinite(number)&&number>=0?number:null;
}

function personWeight(person,result,cfg){
  const manual=manualDaysValue(person,result.id,cfg);
  if(manual!==null)return manual;
  if(result.durationMode==="manual"||result.durationMode==="none")return 0;
  const range=personRange(person,result.start,result.end);
  return range?personDaysMeasure(range.start,range.end,cfg):0;
}

function manualSegmentDaysValue(person,caseId,year){
  const byCase=person.manualSegmentDays&&person.manualSegmentDays[caseId];
  if(!byCase)return null;
  const value=byCase[year];
  if(value===""||value===null||value===undefined)return null;
  const number=Number(value);
  return Number.isFinite(number)&&number>=0?number:null;
}

function personDaysMeasure(start,end,cfg){
  if(cfg.accrual==="actualActual"&&cfg.actualActualPersonBasis==="calendarDays")return inclusiveDays(start,end);
  return workingDays(start,end,cfg);
}

function segmentReferenceDays(result,segment,cfg){
  if(result.durationMode==="manual"){
    const key=`m|${segment.year}|${segment.months}`;
    if(cfg.segmentReferenceCache.has(key))return cfg.segmentReferenceCache.get(key);
    const yearFullDays=workingDays(new Date(segment.year,0,1),new Date(segment.year,11,31),cfg);
    const ref=yearFullDays*(segment.months/12);
    lruSet(cfg.segmentReferenceCache,key,ref);
    return ref;
  }
  const key=`d|${cfg.accrual}|${cfg.actualActualPersonBasis}|${dateKey(segment.from)}|${dateKey(segment.to)}`;
  if(cfg.segmentReferenceCache.has(key))return cfg.segmentReferenceCache.get(key);
  const ref=personDaysMeasure(segment.from,segment.to,cfg);
  lruSet(cfg.segmentReferenceCache,key,ref);
  return ref;
}

function personSegmentDays(person,result,segment,cfg){
  if(result.durationMode==="manual"){
    return manualSegmentDaysValue(person,result.id,segment.year)||0;
  }
  const range=personRange(person,result.start,result.end);
  if(!range)return 0;
  const clipped=clampRange(range.start,range.end,segment.from,segment.to);
  return clipped?personDaysMeasure(clipped.start,clipped.end,cfg):0;
}

function personSegmentFactor(person,result,segment,cfg){
  const referenceDays=segmentReferenceDays(result,segment,cfg);
  if(referenceDays<=0)return 0;
  const days=personSegmentDays(person,result,segment,cfg);
  if(days<=0)return 0;
  const ratio=Math.min(1,days/referenceDays);
  return segment.factor*ratio;
}

function personPeriodFactor(person,result,segment,period,cfg){
  if(result.durationMode==="manual"){
    if(segment.factor<=0)return 0;
    const segFactor=personSegmentFactor(person,result,segment,cfg);
    return segFactor*(period.factor/segment.factor);
  }
  const range=personRange(person,result.start,result.end);
  if(!range)return 0;
  const clipped=clampRange(range.start,range.end,period.from,period.to);
  if(!clipped)return 0;
  const totalDays=personDaysMeasure(period.from,period.to,cfg);
  if(totalDays<=0)return 0;
  const days=personDaysMeasure(clipped.start,clipped.end,cfg);
  const ratio=Math.min(1,days/totalDays);
  return period.factor*ratio;
}

function calculatePersonSegments(personPrincipal,result,person,cfg){
  const segments=[];
  const frequency=resolveRateFrequency(result,cfg);
  let runningPrincipal=personPrincipal;
  result.segments.forEach(segment=>{
    const openingPrincipal=runningPrincipal;
    const periods=result.durationMode==="manual"?splitManualSegmentByFrequency(segment,frequency):splitSegmentByFrequency(segment,frequency,cfg);
    let rawReturn=0,anyPresent=false;
    periods.forEach(period=>{
      const periodFactor=personPeriodFactor(person,result,segment,period,cfg);
      const present=periodFactor>0;
      if(present)anyPresent=true;
      const periodRaw=present?runningPrincipal*segment.appliedRate/100*periodFactor:0;
      rawReturn+=periodRaw;
      if(result.compounding&&present)runningPrincipal+=periodRaw;
    });
    const returnValue=result.rounding==="perSegment"?roundUnit(rawReturn):rawReturn;
    if(result.compounding&&result.rounding==="perSegment")runningPrincipal+=returnValue-rawReturn;
    const factor=personSegmentFactor(person,result,segment,cfg);
    segments.push({...segment,factor,present:anyPresent,segPrincipal:openingPrincipal,closingPrincipal:runningPrincipal,rawReturn,returnValue});
  });
  let total=segments.reduce((sum,s)=>sum+s.returnValue,0);
  if(result.rounding==="total")total=roundUnit(segments.reduce((sum,s)=>sum+s.rawReturn,0));
  if(result.rounding==="none")total=segments.reduce((sum,s)=>sum+s.rawReturn,0);
  const rawTotal=segments.reduce((sum,s)=>sum+s.rawReturn,0);
  if(result.rounding==="total"&&segments.length){
    const adjusted=allocateUnits(total,segments.map(s=>s.rawReturn),"whole");
    segments.forEach((s,i)=>{s.returnValue=adjusted[i];});
  }
  return{segments,total,rawTotal};
}

function addDays(d,n){
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
}

function caseCoverageGaps(result,people,cfg){
  if(result.durationMode==="manual"||!result.start||!result.end)return[];
  const ranges=[];
  people.forEach(person=>{
    const range=personRange(person,result.start,result.end);
    if(range)ranges.push(range);
  });
  if(!ranges.length){
    const workingDaysCount=workingDays(result.start,result.end,cfg);
    return[{start:result.start,end:result.end,workingDaysCount,hasImpact:workingDaysCount>0}];
  }
  ranges.sort((a,b)=>a.start-b.start);
  const gaps=[];
  let cursor=result.start;
  ranges.forEach(r=>{
    if(r.start>cursor){
      const gapEnd=addDays(r.start,-1);
      if(gapEnd>=cursor)gaps.push({start:new Date(cursor),end:gapEnd});
    }
    if(addDays(r.end,1)>cursor)cursor=addDays(r.end,1);
  });
  if(cursor<=result.end)gaps.push({start:new Date(cursor),end:result.end});
  return gaps.map(g=>{
    const workingDaysCount=workingDays(g.start,g.end,cfg);
    return{...g,workingDaysCount,hasImpact:workingDaysCount>0};
  });
}

function setIssue(id,reason,cfg){
  if(id)cfg.caseIssues.set(id,reason);
}
function computeCase(item,cfg){
  cfg.caseIssues.delete(item.id);
  const shortage=clampNumber(item.shortageValue,0,MAX_MONEY,0);
  if(shortage<=0){setIssue(item.id,"noShortage",cfg);return null;}

  const noSchedule=item.durationMode==="none";
  const includeInvestment=noSchedule?false:item.includeInvestment!==false;
  const manual=cfg.manualInputsEnabled&&item.durationMode==="manual";
  const distributionNeedsDates=eligiblePeople(cfg).length>0&&cfg.distribution!=="express";
  const datesRequired=noSchedule?false:(includeInvestment||distributionNeedsDates);
  let definitions=[],start=null,end=null;
  if(noSchedule){
    definitions=[];
  }else if(item.durationMode==="manual"&&!cfg.manualInputsEnabled){
    setIssue(item.id,"manualInputDisabled",cfg);return null;
  }else if(manual){
    const manualResult=sanitizeManualSegmentsForCalc(item);
    if(manualResult.ok){
      definitions=manualResult.definitions;
    }else if(manualResult.empty){
      if(datesRequired){setIssue(item.id,"invalidManualDuration",cfg);return null;}
    }else{
      setIssue(item.id,"invalidManualDuration",cfg);return null;
    }
  }else{
    const parsedStart=parseDate(item.startDate);
    const parsedEnd=parseDate(item.endDate);
    if(parsedStart&&parsedEnd&&parsedStart>parsedEnd){setIssue(item.id,"endBeforeStart",cfg);return null;}
    if(!parsedStart||!parsedEnd){
      if(datesRequired){setIssue(item.id,"missingDates",cfg);return null;}
    }else{
      start=parsedStart;end=parsedEnd;
      definitions=generateSegments(start,end,cfg);
    }
  }

  const expenseRate=clampNumber(item.expensesRate,0,MAX_RATE,0);
  const expenseValue=shortage*expenseRate/100;
  const includeShortage=item.includeShortage!==false;
  const includeExpenses=!!item.includeExpenses;
  const investmentOnShortage=includeShortage&&item.investmentOnShortage!==false;
  const investmentOnExpenses=includeExpenses&&item.investmentOnExpenses!==false;
  const base=(includeShortage?shortage:0)+(includeExpenses?expenseValue:0);
  const principal=(investmentOnShortage?shortage:0)+(investmentOnExpenses?expenseValue:0);
  const useCustomRate=!!item.useCustomRate;
  const customText=String(item.customRate??"").trim();
  const customRateNum=Number(item.customRate);

  if(!includeShortage&&!includeExpenses){setIssue(item.id,"noComponents",cfg);return null;}
  if(includeInvestment&&useCustomRate&&(customText===""||!Number.isFinite(customRateNum))){setIssue(item.id,"invalidCustomRate",cfg);return null;}
  if(includeInvestment&&principal<=0){setIssue(item.id,"noInvestmentBasis",cfg);return null;}

  let segments=[],returnValue=0,missingYears=[];
  if(includeInvestment){
    const calculation=calculateCaseSegments(definitions,principal,item,cfg);
    segments=calculation.segments;
    returnValue=calculation.total;
    missingYears=calculation.missingYears;
  }

  const due=base+returnValue;
  const acknowledged=Array.isArray(item.acknowledgedMissingYears)?item.acknowledgedMissingYears:[];
  const rateBlocked=missingYears.some(year=>!acknowledged.includes(year));

  const manualLabel=manual?definitions.map(segment=>`${segment.year}: ${cfg.decimal(segment.months,2)} ${cfg.monthsLabel}`).join(" · "):"";

  return{
    id:item.id,
    name:item.name.trim()||`${cfg.calculationLabel} ${cfg.cases.findIndex(c=>c.id===item.id)+1}`,
    shortage,
    expenseRate,
    expenseValue,
    base,
    principal,
    start:manual?{manualRange:true,label:manualLabel}:start,
    end:manual?null:end,
    includeShortage,
    includeExpenses,
    includeInvestment,
    investmentOnShortage,
    investmentOnExpenses,
    rounding:item.rounding,
    compounding:!!item.compounding,
    applyReturn:includeInvestment,
    useCustomRate,
    customRate:useCustomRate?customRateNum:null,
    durationMode:noSchedule?"none":item.durationMode==="manual"?"manual":"dates",
    manualLabel,
    segments,
    returnValue,
    due,
    missingYears,
    rateBlocked,
    acknowledgedMissingYears:acknowledged,
    rateFrequency:resolveRateFrequency(item,cfg),
    personAuthoritative:false
  };
}

function distributeCase(result,people,cfg){
  if(!people.length)return{rows:[],detailRows:[],unallocated:result.due,caseRollup:null};

  const equal=cfg.distribution==="express";
  const weights=equal?people.map(()=>1):people.map(person=>personWeight(person,result,cfg));
  const weightTotal=weights.reduce((a,b)=>a+b,0);

  if(weightTotal<=0){
    const rows=people.map(person=>({
      caseId:result.id,caseName:result.name,personId:person.id,personName:person.name,
      days:0,principalShare:0,returnValue:0,amount:0,clamped:false
    }));
    return{rows,detailRows:[],unallocated:result.due,caseRollup:null};
  }

  const perPeriod=!equal&&cfg.investmentMode==="perPeriod"&&result.includeInvestment&&result.segments.length>0;
  const returnMode=result.rounding==="none"?"exact":"whole";
  const principalShares=result.includeInvestment?allocateUnits(result.principal,weights,"cents"):weights.map(()=>0);

  let returnShares,amountShares,personCalcs=null;
  if(perPeriod){
    personCalcs=people.map((person,index)=>calculatePersonSegments(principalShares[index],result,person,cfg));
    returnShares=personCalcs.map(c=>c.total);
    const baseShares=allocateUnits(result.base,weights,result.rounding==="none"?"exact":"cents");
    amountShares=people.map((_,index)=>baseShares[index]+returnShares[index]);
  }else{
    returnShares=allocateUnits(result.returnValue,weights,returnMode);
    amountShares=allocateUnits(result.due,weights,result.rounding==="none"?"exact":"cents");
  }

  const rows=people.map((person,index)=>{
    const joinParsed=parseDate(person.joinDate);
    const leaveParsed=parseDate(person.leaveDate);
    const clamped=!equal&&result.durationMode!=="manual"&&!!((joinParsed&&result.start&&joinParsed<result.start)||(leaveParsed&&result.end&&leaveParsed>result.end));
    const noPeriodOverlap=!!(perPeriod&&weights[index]>0&&personCalcs&&!personCalcs[index].segments.some(s=>s.present));
    return{
      caseId:result.id,caseName:result.name,personId:person.id,personName:person.name,
      days:equal?null:weights[index],
      principalShare:principalShares[index],
      returnValue:returnShares[index],
      amount:amountShares[index],
      manualDays:manualDaysValue(person,result.id,cfg)!==null,
      noPeriodOverlap,
      clamped
    };
  });

  const detailRows=[];
  if(!equal&&result.segments.length){
    const pDetailMode = result.rounding === "none" ? "exact" : "cents";
    rows.forEach((row, index) => {
      if(weights[index] <= 0) return;
      if(perPeriod){
        personCalcs[index].segments.forEach(segment=>{
          detailRows.push({
            caseId:result.id, caseName:result.name, personId:row.personId, personName:row.personName,
            year:segment.year, period:{from:segment.from, to:segment.to}, days:row.days,
            principalShare:segment.segPrincipal, annualRate:segment.annualRate, appliedRate:segment.appliedRate,
            factor:segment.factor, returnValue:segment.returnValue, noAccrual:false, present:segment.present,
            clamped:row.clamped, manualDays:row.manualDays, noPeriodOverlap:row.noPeriodOverlap
          });
        });
        return;
      }
      const personShape=calculatePersonSegments(row.principalShare,result,people[index],cfg).segments;
      const segPrincipals = personShape.map(s => s.segPrincipal);
      const segReturns = personShape.map(s => s.rawReturn);
      const pDetailPrincipals = allocateUnits(row.principalShare, segPrincipals, "cents");
      const pDetailReturns = allocateUnits(row.returnValue, segReturns, pDetailMode);

      result.segments.forEach((segment, sIdx) => {
        detailRows.push({
          caseId:result.id, caseName:result.name, personId:row.personId, personName:row.personName,
          year:segment.year, period:{from:segment.from, to:segment.to}, days:row.days,
          principalShare: pDetailPrincipals[sIdx], annualRate:segment.annualRate, appliedRate:segment.appliedRate,
          factor:segment.factor, returnValue: pDetailReturns[sIdx], noAccrual:false,
          clamped: row.clamped, manualDays: row.manualDays
        });
      });
    });
  }
  if(equal){
    rows.forEach(row=>{
      detailRows.push({...row,year:null,period:null,annualRate:null,appliedRate:null,factor:null});
    });
  }

  let caseRollup=null;
  if(perPeriod&&personCalcs){
    const rolledReturnValue=personCalcs.reduce((sum,c)=>sum+c.total,0);
    const rolledSegments=result.segments.map((segment,sIdx)=>{
      let segPrincipal=0,rawReturn=0,segReturnValue=0,closingPrincipal=0;
      personCalcs.forEach(calc=>{
        const s=calc.segments[sIdx];
        if(!s)return;
        segPrincipal+=s.segPrincipal;
        rawReturn+=s.rawReturn;
        segReturnValue+=s.returnValue;
        closingPrincipal+=s.closingPrincipal;
      });
      return{...segment,segPrincipal,rawReturn,returnValue:segReturnValue,closingPrincipal};
    });
    caseRollup={returnValue:rolledReturnValue,segments:rolledSegments,due:result.base+rolledReturnValue};
  }

  const authoritativeDue=caseRollup?caseRollup.due:result.due;
  const distributed=amountShares.reduce((sum,value)=>sum+value,0);
  return{rows,detailRows,unallocated:roundCents(authoritativeDue-distributed),caseRollup};
}

function computeAll(cfg){
  cfg.caseIssues.clear();
  const valid=cfg.cases.map(item=>computeCase(item,cfg)).filter(Boolean);
  const invalidCount=cfg.cases.length-valid.length;
  const invalidCases=cfg.cases
    .filter(item=>!valid.some(v=>v.id===item.id))
    .map(item=>({
      id:item.id,
      name:item.name.trim()||`${cfg.calculationLabel} ${cfg.cases.findIndex(c=>c.id===item.id)+1}`,
      reasonKey:cfg.caseIssues.get(item.id)||null
    }));
  const people=eligiblePeople(cfg);
  const distributionDetails=[];
  const distributionRows=[];
  let unallocatedRaw=0;

  valid.forEach(result=>{
    const distribution=distributeCase(result,people,cfg);
    if(distribution.caseRollup){
      result.returnValue=distribution.caseRollup.returnValue;
      result.segments=distribution.caseRollup.segments;
      result.due=distribution.caseRollup.due;
      result.personAuthoritative=true;
    }
    distributionRows.push(...distribution.rows);
    distributionDetails.push(...distribution.detailRows);
    unallocatedRaw+=distribution.unallocated;
    result.coverageGaps=caseCoverageGaps(result,people,cfg);
  });

  const summaryMap=new Map();
  distributionRows.forEach(row=>{
    if(!summaryMap.has(row.personId)){
      summaryMap.set(row.personId,{personId:row.personId,personName:row.personName,days:0,principalShare:0,returnValue:0,amount:0});
    }
    const target=summaryMap.get(row.personId);
    if(row.days!==null)target.days+=row.days;
    target.principalShare+=row.principalShare;
    target.returnValue+=row.returnValue;
    target.amount+=row.amount;
  });

  const rawUnallocated=roundCents(unallocatedRaw);

  return{
    cases:valid,
    invalidCount,
    invalidCases,
    people,
    distributionRows,
    distributionDetails,
    distributionSummary:[...summaryMap.values()],
    shortageTotal:valid.reduce((sum,item)=>sum+(item.includeShortage?item.shortage:0),0),
    expenseTotal:valid.reduce((sum,item)=>sum+(item.includeExpenses?item.expenseValue:0),0),
    rawShortageTotal:valid.reduce((sum,item)=>sum+item.shortage,0),
    rawExpenseTotal:valid.reduce((sum,item)=>sum+item.expenseValue,0),
    returnTotal:valid.reduce((sum,item)=>sum+item.returnValue,0),
    grandTotal:valid.reduce((sum,item)=>sum+item.due,0),
    missingYears:[...new Set(valid.flatMap(item=>item.missingYears))].sort((a,b)=>a-b),
    unresolvedMissingYears:[...new Set(valid.flatMap(item=>{
      const acknowledged=Array.isArray(item.acknowledgedMissingYears)?item.acknowledgedMissingYears:[];
      return item.missingYears.filter(y=>!acknowledged.includes(y));
    }))].sort((a,b)=>a-b),
    resolvedMissingYears:[...new Set(valid.flatMap(item=>{
      const acknowledged=Array.isArray(item.acknowledgedMissingYears)?item.acknowledgedMissingYears:[];
      return item.missingYears.filter(y=>acknowledged.includes(y));
    }))].sort((a,b)=>a-b),
    clampedCount:distributionRows.filter(row=>row.clamped).length,
    unallocated:Math.abs(rawUnallocated)<EPS_MONEY?0:rawUnallocated,
    blockedCases:valid.filter(item=>item.rateBlocked)
  };
}

return{
  parseDate,dateKey,utcDayNumber,inclusiveDays,daysInYear,
  normalizeCommercialStart,normalizeCommercialEnd,
  isWorkingDay,nextWorkingDay,previousWorkingDay,
  normalizeNextWorkingStart,normalizeNextWorkingEnd,
  generateSegments,clampRange,roundUnit,numberValue,roundCents,

  allocateUnits,sanitizeManualSegmentsForCalc,resolveRateFrequency,
  splitSegmentByFrequency,splitManualSegmentByFrequency,calculateCaseSegments,
  eligiblePeople,personRange,personHasSegmentDaysForCase,manualDaysValue,
  personWeight,manualSegmentDaysValue,personDaysMeasure,segmentReferenceDays,
  personSegmentDays,personSegmentFactor,personPeriodFactor,calculatePersonSegments,
  addDays,caseCoverageGaps,computeCase,distributeCase,computeAll
};

const CACHE_LRU_LIMIT=5000;
function lruSet(cache,key,value){
  if(cache.has(key))cache.delete(key);
  cache.set(key,value);
  if(cache.size>CACHE_LRU_LIMIT)cache.delete(cache.keys().next().value);
}

function componentsLabel(item,t){
  const parts=[];
  if(item.includeShortage)parts.push(t.chipShortage);
  if(item.includeExpenses)parts.push(t.chipExpenses);
  const base=parts.length?parts.join(" + "):t.noComponents;
  if(!item.includeInvestment)return`${base} (${t.noInvestmentSuffix})`;
  const onParts=[];
  if(item.investmentOnShortage)onParts.push(t.chipShortage);
  if(item.investmentOnExpenses)onParts.push(t.chipExpenses);
  const onLabel=onParts.length?onParts.join(" + "):t.noComponents;
  return`${base} + ${t.chipInvestment} (${t.investmentAppliesTo} ${onLabel})`;
}

function investmentModelSuffix(item,t){
  return item.personAuthoritative?` · ${t.personAuthoritativeNote}`:"";

  test("Property test","500 randomized case/people configurations satisfy P1-P3",()=>{
    const accruals=["actualActual","commercial15","inclusiveMonths","nextWorkingMonth"];
    const roundings=["total","perSegment","none"];
    const distributions=["express","expanded"];
    const investmentModes=["blended","perPeriod"];
    let failures=[];
    const N=500;
    for(let i=0;i<N;i++){
      const rnd=(seed)=>{const x=Math.sin(i*97+seed)*10000;return x-Math.floor(x);};
      const y1=2018+Math.floor(rnd(1)*7);
      const y2=y1+Math.floor(rnd(2)*4);
      const cfg=baseCfg({
        accrual:accruals[Math.floor(rnd(3)*4)],
        distribution:distributions[Math.floor(rnd(4)*2)],
        investmentMode:investmentModes[Math.floor(rnd(5)*2)],
        rates:{2017:15.25,2018:16.25,2019:17.25,2020:12.75,2021:8.75,2022:8.75,2023:16.75,2024:19.75,2025:27.75,2026:20.5}
      });
      const item=baseCase({
        shortageValue:Math.round(rnd(6)*900000*100)/100+1000,
        rounding:roundings[Math.floor(rnd(7)*3)],
        compounding:rnd(8)>0.4,
        startDate:`${y1}-01-15`,endDate:`${y2}-11-20`
      });
      cfg.cases=[item];
      const numPeople=1+Math.floor(rnd(9)*4);
      const people=[];
      for(let p=0;p<numPeople;p++){
        const py1=y1+Math.floor(rnd(10+p)*(y2-y1+1));
        const py2=py1+Math.floor(rnd(20+p)*(y2-py1+1));
        people.push(person("p"+p,"Person "+p,`${py1}-0${1+Math.floor(rnd(30+p)*8)}-15`,`${py2}-0${1+Math.floor(rnd(40+p)*8)}-20`));
      }
      const result=Engine.computeCase(item,cfg);
      if(!result)continue;
      const segSum=result.segments.reduce((s,seg)=>s+seg.returnValue,0);
      if(!near(segSum,result.returnValue,EPS_MONEY)){
        failures.push(`trial ${i}: P2 fail segSum=${segSum} returnValue=${result.returnValue}`);
        continue;
      }
      const dist=Engine.distributeCase(result,people,cfg);
      const due=dist.caseRollup?dist.caseRollup.due:result.due;
      const zeroWeight=dist.rows.every(r=>r.amount===0)&&dist.rows.length>0;
      if(zeroWeight){
        if(!near(dist.unallocated,due,EPS_MONEY)){
          failures.push(`trial ${i}: P3 fail (zero weight) unallocated=${dist.unallocated} due=${due} cfg=${JSON.stringify({accrual:cfg.accrual,distribution:cfg.distribution,investmentMode:cfg.investmentMode,rounding:item.rounding})}`);
        }
        continue;
      }
      const sum=dist.rows.reduce((s,r)=>s+r.amount,0);
      if(!near(sum,due,EPS_MONEY)){
        failures.push(`trial ${i}: P1 fail sum=${sum} due=${due} cfg=${JSON.stringify({accrual:cfg.accrual,distribution:cfg.distribution,investmentMode:cfg.investmentMode,rounding:item.rounding})}`);
      }
    }
    const ok=failures.length===0;
    return{pass:ok,detail:ok?`${N} trials, 0 failures`:`${failures.length}/${N} failed. First: ${failures[0]}`};
  });

  function run(){
    return registry.map(t=>{
      let pass=false,detail="";
      try{
        const r=t.fn();
        if(typeof r==="boolean"){pass=r;}
        else if(r&&typeof r==="object"){pass=!!r.pass;detail=r.detail||"";}
      }catch(e){
        pass=false;detail="threw: "+(e&&e.message||String(e));
      }
      return{category:t.category,name:t.name,pass,detail};
    });
  }

  return{run,registry};
})();

function formatMoneyInput(raw){
  const cleaned=String(raw??"").replace(/,/g,"");
  if(cleaned==="")return"";
  const n=Number(cleaned);
  if(!Number.isFinite(n))return cleaned;
  const parts=cleaned.split(".");
  const intPart=Math.trunc(Math.abs(n)).toLocaleString("en-US");
  const sign=n<0?"-":"";
  return parts.length>1?`${sign}${intPart}.${parts[1]}`:`${sign}${intPart}`;
}

function renderCoverageGapNotices(gaps,caseName){
  if(!gaps||!gaps.length)return"";
  const t=I18N[state.lang];
  const impactful=gaps.filter(g=>g.hasImpact);
  const noImpact=gaps.filter(g=>!g.hasImpact);
  const label=text=>caseName?`<strong>${esc(caseName)}:</strong> ${esc(text)}`:`<strong>${esc(text)}</strong>`;
  let html="";
  if(impactful.length){
    const ranges=impactful.map(g=>`${periodText(g.start,g.end)} (${decimal(g.workingDaysCount,0)} ${t.days} — ${t.coverageGapImpact})`).join(" · ");
    html+=`<div class="noticeCritical">${ICONS.warning}<span>${label(t.coverageGapWarning)} ${ranges}</span></div>`;
  }
  if(noImpact.length){
    const ranges=noImpact.map(g=>periodText(g.start,g.end)).join(" · ");
    html+=`<div class="notice">${ICONS.warning}<span>${label(t.coverageGapNoImpact)} ${ranges}</span></div>`;
  }
  return html;
}
function periodText(from,to){
  const t=I18N[state.lang];
  if(from&&from.manualRange)return from.label;
  if(from&&from.manual)return`${from.year} · ${decimal(from.months,2)} ${t.months}`;
  if(!from&&!to)return"—";
  return `${formatDate(from)} — ${formatDate(to)}`;
}

function trapFocus(e, el) {
  if (e.key !== 'Tab') return;
  const focusable = el.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  
  if (e.shiftKey && document.activeElement === first) {
    last.focus({preventScroll:true}); e.preventDefault();
  } else if (!e.shiftKey && document.activeElement === last) {
    first.focus({preventScroll:true}); e.preventDefault();
  }
}

let currentPanelAnchor=null;

function positionFloatingPanel(anchor){
  const panel=document.getElementById("floatingPanel");
  if(!panel||!anchor)return;
  const rect=anchor.getBoundingClientRect();
  const pw=panel.offsetWidth,ph=panel.offsetHeight;
  const vw=window.innerWidth,vh=window.innerHeight;
  const rtl=document.documentElement.getAttribute("dir")==="rtl";
  let left=rtl?rect.right-pw:rect.left;
  if(left+pw>vw-8)left=vw-8-pw;
  if(left<8)left=8;
  let top=rect.bottom+6;
  let flipped=false;
  if(top+ph>vh-8){top=Math.max(8,rect.top-ph-6);flipped=true;}
  panel.style.left=`${left}px`;
  panel.style.top=`${top}px`;
  panel.style.setProperty("--panel-offset",flipped?"6px":"-6px");
  panel.style.transformOrigin=`${rtl?"right":"left"} ${flipped?"bottom":"top"}`;
}

function onFloatingPanelOutsideClick(e){
  const panel=document.getElementById("floatingPanel");
  if(!panel)return;
  if(panel.contains(e.target))return;
  if(currentPanelAnchor&&(currentPanelAnchor===e.target||currentPanelAnchor.contains?.(e.target)))return;
  closeFloatingPanel();
}

function onFloatingPanelKeydown(e){
  if(e.key==="Escape")closeFloatingPanel();
  const panel=document.getElementById("floatingPanel");
  if(panel && panel.style.display==="block") trapFocus(e, panel);
}

let panelScrollRaf=null;
function onFloatingPanelScroll(){
  if(!currentPanelAnchor||panelScrollRaf)return;
  panelScrollRaf=requestAnimationFrame(()=>{
    panelScrollRaf=null;
    const panel=document.getElementById("floatingPanel");
    if(!panel||panel.style.display!=="block"||!currentPanelAnchor)return;
    const rect=currentPanelAnchor.getBoundingClientRect();
    if(rect.bottom<0||rect.top>window.innerHeight||rect.right<0||rect.left>window.innerWidth){
      closeFloatingPanel();
      return;
    }
    positionFloatingPanel(currentPanelAnchor);
  });
}

function attachFloatingPanelHandlers(){
  document.addEventListener("mousedown",onFloatingPanelOutsideClick,true);
  document.addEventListener("keydown",onFloatingPanelKeydown,true);
  window.addEventListener("scroll",onFloatingPanelScroll,true);
  window.addEventListener("resize",onFloatingPanelScroll);
}

function closeFloatingPanel({restoreFocus=true}={}){
  const panel=document.getElementById("floatingPanel");
  const wasOpen=!!panel&&panel.style.display==="block";
  if(panel){
    panel.style.display="none";
    panel.innerHTML="";
    panel.className="floatingPanel";
  }
  currentPanelAnchor?.classList?.remove("panelOpen");
  currentPanelAnchor=null;
  document.removeEventListener("mousedown",onFloatingPanelOutsideClick,true);
  document.removeEventListener("keydown",onFloatingPanelKeydown,true);
  window.removeEventListener("scroll",onFloatingPanelScroll,true);
  window.removeEventListener("resize",onFloatingPanelScroll);
  if(panelScrollRaf){cancelAnimationFrame(panelScrollRaf);panelScrollRaf=null;}
  if(restoreFocus&&wasOpen&&floatingPanelReturnFocus&&floatingPanelReturnFocus.isConnected){
    floatingPanelReturnFocus.focus({preventScroll:true});
  }
  floatingPanelReturnFocus=null;
}

function openSelectPanel(anchor,options,value,onPick){
  const panel=document.getElementById("floatingPanel");
  const reopening=currentPanelAnchor===anchor&&panel.style.display==="block";
  closeFloatingPanel({restoreFocus:false});
  if(reopening)return;
  floatingPanelReturnFocus=anchor;
  currentPanelAnchor=anchor;
  anchor.classList.add("panelOpen");
  panel.className="floatingPanel panelList";
  panel.innerHTML="";
  options.forEach(opt=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="panelOption"+(opt.value===value?" active":"");
    btn.textContent=opt.label;
    btn.addEventListener("click",()=>{onPick(opt.value);closeFloatingPanel();});
    panel.appendChild(btn);
  });
  panel.style.display="block";
  panel.style.width=`${Math.max(anchor.offsetWidth,170)}px`;
  positionFloatingPanel(anchor);
  attachFloatingPanelHandlers();
}

function segAutoCompletes(el,value){
  if(value.length!==1)return false;
  const d=Number(value);
  if(el.classList.contains("dSeg"))return d>=4;
  if(el.classList.contains("mSeg"))return d>=2;
  return false;
}

function advanceDateSeg(el){
  const wrapper=el.closest(".dateField");
  const next=el.classList.contains("dSeg")?wrapper.querySelector(".mSeg")
    :el.classList.contains("mSeg")?wrapper.querySelector(".ySeg"):null;
  if(next){next.focus({preventScroll:true});next.select();}
  else{el.blur();}
}

function handleDateSegInput(el){
  el.value=el.value.replace(/\D/g,"").slice(0,el.maxLength);
  clearTimeout(el._advanceTimer);
  if(!el.value.length)return;
  if(el.value.length>=el.maxLength||segAutoCompletes(el,el.value)){
    advanceDateSeg(el);
  }else{
    el._advanceTimer=setTimeout(()=>advanceDateSeg(el),550);
  }
}

function handleDateSegKeydown(e,el){
  if(e.key==="Backspace"&&!el.value){
    const wrapper=el.closest(".dateField");
    const prev=el.classList.contains("ySeg")?wrapper.querySelector(".mSeg")
      :el.classList.contains("mSeg")?wrapper.querySelector(".dSeg"):null;
    if(prev){prev.focus({preventScroll:true});prev.select();e.preventDefault();}
    return;
  }
  if(e.key==="ArrowUp"||e.key==="ArrowDown"){
    e.preventDefault();
    clearTimeout(el._advanceTimer);
    const isYear=el.classList.contains("ySeg");
    const max=el.classList.contains("dSeg")?31:el.classList.contains("mSeg")?12:MAX_YEAR;
    let val=(Number(el.value)||(isYear?new Date().getFullYear():0))+(e.key==="ArrowUp"?1:-1);
    if(isYear){if(val<MIN_YEAR)val=MIN_YEAR;if(val>MAX_YEAR)val=MAX_YEAR;}
    else{if(val<1)val=max;if(val>max)val=1;}
    el.value=isYear?String(val):String(val).padStart(2,"0");
    el.dispatchEvent(new Event("change",{bubbles:false}));
    return;
  }
  handleFastEntry(e);
}

function commitDateSegments(el,applyFn){
  const wrapper=el.closest(".dateField");
  const dEl=wrapper.querySelector(".dSeg"),mEl=wrapper.querySelector(".mSeg"),yEl=wrapper.querySelector(".ySeg");
  if(!dEl.value&&!mEl.value&&!yEl.value){
    applyFn("");
    wrapper.dataset.iso="";
    return;
  }
  const d=dEl.value.length===1?dEl.value.padStart(2,"0"):dEl.value;
  const m=mEl.value.length===1?mEl.value.padStart(2,"0"):mEl.value;
  const y=yEl.value;
  if(d.length!==2||m.length!==2||y.length!==4)return;
  const iso=`${y}-${m}-${d}`;
  const parsed=parseDate(iso);
  if(!parsed){
    setDateSegValues(wrapper,wrapper.dataset.iso||"");
    return;
  }
  dEl.value=d;
  mEl.value=m;
  applyFn(iso);
  wrapper.dataset.iso=iso;
}

function collectDateSources(){
  const t=I18N[state.lang];
  const list=[];
  state.cases.forEach((c,i)=>{
    const label=c.name||`${t.calculation} ${i+1}`;
    if(c.startDate)list.push({label:`${label} — ${t.start}`,iso:c.startDate});
    if(c.endDate)list.push({label:`${label} — ${t.end}`,iso:c.endDate});
  });
  state.people.forEach((p,i)=>{
    const label=p.name||`${t.person} ${i+1}`;
    if(p.joinDate)list.push({label:`${label} — ${t.join}`,iso:p.joinDate});
    if(p.leaveDate)list.push({label:`${label} — ${t.leave}`,iso:p.leaveDate});
  });
  const seen=new Set();
  return list.filter(item=>{
    const key=item.label+"|"+item.iso;
    if(seen.has(key))return false;
    seen.add(key);
    return true;
  });
}

function renderDaysGrid(view){
  const days=weekdayShortLabels();
  const firstOfMonth=new Date(view.year,view.month,1);
  const startOffset=firstOfMonth.getDay();
  const daysCount=new Date(view.year,view.month+1,0).getDate();
  const todayKey=dateKey(new Date());
  const cells=[];
  for(let i=0;i<startOffset;i++)cells.push(null);
  for(let d=1;d<=daysCount;d++)cells.push(d);
  return`
    <div class="datePanelWeekdays">${days.map(d=>`<span>${esc(d)}</span>`).join("")}</div>
    <div class="datePanelGrid">
      ${cells.map(d=>{
        if(d===null)return`<span class="dateCell empty"></span>`;
        const iso=`${view.year}-${String(view.month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const cls=["dateCell"];
        if(iso===view.selected)cls.push("selected");
        if(iso===todayKey)cls.push("today");
        return`<button type="button" class="${cls.join(" ")}" data-day="${d}">${d}</button>`;
      }).join("")}
    </div>
  `;
}

function renderMonthsGrid(view){
  const months=state.lang==="ar"?monthLabels():monthShortLabels();
  const selectedDate=parseDate(view.selected);
  const todayYear=new Date().getFullYear();
  const todayMonth=new Date().getMonth();
  const gridClass=state.lang==="ar"?"datePanelGridWide monthsGridAr":"datePanelGridWide";
  return`
    <div class="${gridClass}">
      ${months.map((label,index)=>{
        const cls=["blockCell"];
        if(selectedDate&&selectedDate.getFullYear()===view.year&&selectedDate.getMonth()===index)cls.push("selected");
        else if(view.year===todayYear&&index===todayMonth)cls.push("today");

function renderYearsGrid(view){
  const rangeStart=Math.floor(view.year/12)*12;
  const selectedDate=parseDate(view.selected);
  const todayYear=new Date().getFullYear();
  const years=Array.from({length:12},(_,i)=>rangeStart+i);
  return`
    <div class="datePanelGridWide">
      ${years.map(year=>{
        const cls=["blockCell"];
        if(selectedDate&&selectedDate.getFullYear()===year)cls.push("selected");

function datePanelTitleText(view,t){
